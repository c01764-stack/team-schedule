<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무관리 대시보드</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --safety:#fb923c;
    --safety-tint:#fff3e8;
    --edu:#8b5cf6;
    --edu-tint:#f2ecfe;
    --etc:#14b8a6;
    --etc-tint:#e3faf5;
    --bg:#eef2fb;
    --card:#ffffff;
    --border:#e7e6f5;
    --text:#28243d;
    --sub:#726f92;
    --red:#f43f5e;
    --orange:#f59e0b;
    --green:#22c55e;
    --blue:#3b82f6;
    --violet:#8b5cf6;
    --pink:#ec4899;
    /* 카드 입체감 — 가까운 그림자(윤곽)와 먼 그림자(깊이)를 겹쳐 쓴다.
       모서리를 직각으로 바꾼 대신, 카드가 배경에서 떠 보이게 하는 역할을 그림자가 맡는다. */
    --shadow-card:0 1px 2px rgba(30,20,70,.10), 0 8px 18px rgba(30,20,70,.13);
    --shadow-lift:0 2px 4px rgba(30,20,70,.12), 0 16px 30px rgba(30,20,70,.20);
    --shadow-soft:0 1px 2px rgba(30,20,70,.08), 0 5px 12px rgba(30,20,70,.10);
    --shadow-modal:0 4px 10px rgba(76,29,149,.18), 0 24px 60px rgba(76,29,149,.30);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard Variable',Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 8% -12%, rgba(99,102,241,.10), transparent 46%),
      radial-gradient(circle at 92% 106%, rgba(236,72,153,.09), transparent 48%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh;
    color:var(--text);
  }
  .wrap{max-width:1360px;margin:0 auto;padding:28px 20px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  header h1{
    font-size:33px;margin:0 0 4px;font-weight:800;
    background:linear-gradient(135deg,#6366f1,#8b5cf6 45%,#ec4899);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:-.3px;
  }
  header p{margin:0;color:var(--sub);font-size:13px;}
  .today-badge{background:var(--card);border:2px solid var(--edu);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--text);font-weight:600;box-shadow:0 3px 10px rgba(139,92,246,.15);}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .header-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .sync-status{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:600;}
  .sync-status.saving{color:var(--orange);}
  .sync-status.error{color:var(--red);}
  .icon-btn{background:var(--card);border:1px solid var(--border);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--violet);box-shadow:0 2px 6px rgba(99,102,241,.12);}
  .icon-btn:hover{background:var(--edu-tint);transform:translateY(-1px);}
  .modal-box textarea{width:100%;padding:8px 9px;border:2px solid var(--border);border-radius:12px;font-size:12px;font-family:inherit;resize:vertical;}
  .setup-banner{background:linear-gradient(135deg,#fff3e0,#ffe4ec);border:2px solid #ffd39a;border-radius:0;padding:14px 16px;margin-bottom:22px;font-size:13px;color:#92400e;box-shadow:var(--shadow-soft);}
  .setup-banner button{margin-left:8px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border:none;border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:700;}

  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--violet);border-radius:0;padding:14px 16px;box-shadow:var(--shadow-card);transition:transform .15s, box-shadow .15s;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .stat-card .num{font-size:26px;font-weight:800;}
  .stat-card .label{font-size:12px;color:var(--sub);margin-top:2px;font-weight:600;}
  .stat-card.done{border-left-color:var(--green);background:linear-gradient(180deg,#f0fdf4,var(--card) 40%);}
  .stat-card.done .num{color:var(--green);}
  .stat-card.overdue{border-left-color:var(--red);background:linear-gradient(180deg,#fff1f2,var(--card) 40%);}
  .stat-card.overdue .num{color:var(--red);}
  .stat-card.progress{border-left-color:var(--blue);background:linear-gradient(180deg,#eff6ff,var(--card) 40%);}
  .stat-card.progress .num{color:var(--blue);}

  .tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:none;flex-wrap:wrap;}
  .tab{padding:10px 20px;font-size:15.5px;cursor:pointer;color:var(--sub);border-bottom:none;border-radius:999px;background:#fff;border:2px solid var(--border);user-select:none;font-weight:600;transition:all .15s;box-shadow:0 4px 14px rgba(30,20,70,.1);}
  .tab:hover{border-color:var(--violet);color:var(--violet);}
  .tab.active{color:#fff;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;box-shadow:0 4px 12px rgba(139,92,246,.35);}

  .add-form{background:var(--card);border:1px solid var(--border);border-radius:0;padding:18px;margin-bottom:22px;display:grid;grid-template-columns:100px 1.2fr 90px 130px 90px 1fr 90px;gap:10px;align-items:end;box-shadow:var(--shadow-card);}
  .add-form label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  .add-form input,.add-form select{width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;transition:border-color .15s;}
  .add-form input:focus,.add-form select:focus{outline:none;border-color:var(--violet);}
  .add-form button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;padding:10px 0;font-size:13px;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(139,92,246,.3);}
  .add-form button:hover{opacity:.92;transform:translateY(-1px);}

  /* ---------- 저장 실패 알림 바 ---------- */
  .save-error-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:150;
    display:none;align-items:center;gap:14px;flex-wrap:wrap;
    background:#fff1f2;border-top:2px solid #fca5a5;
    padding:12px 20px;box-shadow:0 -6px 20px rgba(30,20,70,.14);
  }
  .save-error-text{flex:1 1 320px;font-size:13px;line-height:1.55;color:#9f1239;min-width:0;}
  .save-error-text b{color:#be123c;}
  .save-error-reason{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;word-break:break-word;}
  .save-error-btn{
    flex-shrink:0;border:none;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:700;
    font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;
    box-shadow:0 4px 12px rgba(244,63,94,.32);
  }
  .save-error-btn:hover{transform:translateY(-1px);}
  .save-error-btn:disabled{background:#f1f0f7;color:var(--sub);box-shadow:none;cursor:default;transform:none;}
  /* 알림 바가 본문 아래쪽을 가리지 않도록 여백을 준다 */
  body.has-save-error .wrap{padding-bottom:130px;}

  /* ---------- 로그인 게이트 ---------- */
  .auth-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(circle at 10% -10%,rgba(99,102,241,.16),transparent 46%),
               radial-gradient(circle at 90% 106%,rgba(236,72,153,.14),transparent 48%),var(--bg);}
  .auth-overlay.open{display:flex;}
  body.auth-locked .wrap{display:none;}
  .auth-box{background:var(--card);border:1px solid var(--border);border-radius:0;padding:30px 28px;
    width:400px;max-width:100%;box-shadow:0 20px 50px rgba(30,20,70,.20);}
  .auth-box h2{margin:0 0 4px;font-size:22px;font-weight:800;
    background:linear-gradient(135deg,#6366f1,#8b5cf6 45%,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-box .auth-sub{margin:0 0 20px;font-size:12.5px;color:var(--sub);line-height:1.55;}
  .auth-spinner{width:26px;height:26px;margin:4px auto 6px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--violet);animation:authSpin .8s linear infinite;}
  @keyframes authSpin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .auth-spinner{animation-duration:2.4s;} }
  .auth-box .field{margin-bottom:12px;}
  .auth-box label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:700;}
  .auth-box input{width:100%;padding:11px 13px;border:2px solid var(--border);border-radius:12px;
    font-size:14px;font-family:inherit;background:var(--card);color:var(--text);}
  .auth-box input:focus{outline:none;border-color:var(--violet);}
  .auth-box .btn-primary{width:100%;padding:13px 0;margin-top:6px;font-size:14px;}
  .auth-error{font-size:12.5px;color:var(--red);font-weight:700;margin:10px 0 0;min-height:17px;}
  .auth-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--sub);line-height:1.6;}
  .auth-foot button{background:none;border:none;color:var(--violet);font-weight:700;cursor:pointer;font-size:11.5px;font-family:inherit;padding:0;text-decoration:underline;}

  .user-chip{background:var(--card);border:2px solid var(--edu);border-radius:999px;padding:6px 14px;font-size:12.5px;
    font-weight:700;color:var(--text);box-shadow:0 3px 10px rgba(139,92,246,.15);white-space:nowrap;}
  .user-chip{cursor:pointer;}
  .user-chip:hover{border-color:var(--violet);}
  .user-chip .role{font-size:11px;color:var(--sub);font-weight:600;margin-left:5px;}
  .user-chip.pw-temp{border-color:var(--orange);}
  .pw-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:6px;
    vertical-align:middle;box-shadow:0 0 0 3px rgba(245,158,11,.2);}
  .pw-warn{background:#fff7e6;border:1.5px solid #fcd34d;color:#92400e;border-radius:0;
    padding:10px 12px;font-size:12px;font-weight:600;line-height:1.5;margin-bottom:14px;}
  .acct-temp{display:inline-block;margin-left:5px;padding:2px 7px;border-radius:999px;
    background:#fef3c7;color:#b45309;font-size:10px;font-weight:800;}

  /* ---------- 전달사항 읽음 확인 ---------- */
  .notice-reads{margin-top:12px;padding-top:11px;border-top:1px dashed var(--border);
    display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;}
  .read-btn{border:none;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;
    font-family:inherit;cursor:pointer;white-space:nowrap;
    background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;box-shadow:0 3px 10px rgba(245,158,11,.32);}
  .read-btn:hover{transform:translateY(-1px);}
  .read-btn.done{background:#dcfce7;color:#15803d;box-shadow:none;border:1.5px solid #86efac;}
  .read-btn:disabled{background:#f1f0f7;color:var(--sub);box-shadow:none;cursor:not-allowed;transform:none;}
  .read-count{font-size:12.5px;font-weight:800;color:var(--text);white-space:nowrap;}
  .read-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .read-chip{display:inline-flex;align-items:center;gap:5px;background:#dcfce7;color:#15803d;
    border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .read-chip.unread{background:#f1f0f7;color:var(--sub);}
  .read-chip .at{font-weight:600;opacity:.75;font-size:10.5px;}
  .read-sep{font-size:11px;color:var(--sub);font-weight:800;align-self:center;
    padding-left:6px;margin-left:2px;border-left:1px solid var(--border);}
  .read-note{font-size:11.5px;color:var(--sub);flex-basis:100%;}

  /* ---------- 미확인 강조 (은은한 맥박) ----------
     내가 아직 확인 체크를 안 한 전달사항에만 붙는다.
     .needs-ack : 배너/카드 테두리+배경이 1.8초 주기로 부드럽게 밝아졌다 돌아옴
     .ack-badge : "확인 필요" 배지가 같은 주기로 숨쉬듯 깜빡임
     .read-btn.urgent : 확인 버튼이 살짝 커졌다 작아짐
     동작 최소화 설정(prefers-reduced-motion)에서는 애니메이션 없이 정적 강조만 남긴다. */
  @keyframes ackPulse{
    0%,100%{ border-color:var(--orange); box-shadow:0 0 0 0 rgba(245,158,11,.30), 0 6px 20px rgba(30,20,70,.10); }
    50%    { border-color:#fb923c;       box-shadow:0 0 0 7px rgba(245,158,11,.02), 0 6px 22px rgba(245,158,11,.28); }
  }
  @keyframes ackBadge{
    0%,100%{ opacity:1;  transform:scale(1); }
    50%    { opacity:.45; transform:scale(.96); }
  }
  @keyframes ackBtn{
    0%,100%{ transform:scale(1);    box-shadow:0 3px 10px rgba(245,158,11,.32); }
    50%    { transform:scale(1.045); box-shadow:0 5px 18px rgba(245,158,11,.50); }
  }
  @keyframes ackDot{
    0%,100%{ opacity:1;  box-shadow:0 0 0 0 rgba(244,63,94,.45); }
    50%    { opacity:.55; box-shadow:0 0 0 5px rgba(244,63,94,0); }
  }

  .notice-banner.needs-ack,
  .memo-card.needs-ack{
    border:2px solid var(--orange);
    animation:ackPulse 1.8s ease-in-out infinite;
  }
  .memo-card.needs-ack{ background:#fffdf5; }
  .ack-badge{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--red);color:#fff;border-radius:999px;
    padding:3px 11px;font-size:11.5px;font-weight:800;white-space:nowrap;
    animation:ackBadge 1.8s ease-in-out infinite;
  }
  .ack-badge::before{
    content:"";width:6px;height:6px;border-radius:50%;background:#fff;
    animation:ackDot 1.8s ease-in-out infinite;
  }
  .read-btn.urgent{ animation:ackBtn 1.8s ease-in-out infinite; }
  .memo-mine-count.urgent{ animation:ackBadge 1.8s ease-in-out infinite; }
  /* 미확인 건이 몇 개인지 헤더에서 바로 보이도록 */
  .ack-count{font-size:11.5px;font-weight:700;color:var(--red);white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    .notice-banner.needs-ack,
    .memo-card.needs-ack,
    .ack-badge,.ack-badge::before,
    .read-btn.urgent,
    .memo-mine-count.urgent{ animation:none; }
    .notice-banner.needs-ack,
    .memo-card.needs-ack{ box-shadow:0 0 0 3px rgba(245,158,11,.22), 0 6px 20px rgba(30,20,70,.10); }
  }

  /* ---------- 계정 관리 ---------- */
  .acct-table{width:100%;border-collapse:collapse;margin-top:6px;}
  .acct-table{table-layout:fixed;}
  .acct-table th,.acct-table td{padding:8px 6px;font-size:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
  .acct-table col.a-id{width:90px;} .acct-table col.a-name{width:84px;} .acct-table col.a-role{width:98px;}
  .acct-table th{color:var(--sub);font-weight:700;font-size:11px;}
  .acct-table td.acct-actions{text-align:right;white-space:nowrap;}
  .acct-table button{border:1.5px solid var(--border);background:transparent;border-radius:999px;padding:4px 9px;
    font-size:11px;cursor:pointer;color:var(--violet);font-weight:700;font-family:inherit;margin-left:4px;}
  .acct-table button.del{color:var(--red);}
  .acct-role{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;}
  .acct-role.admin{background:#ede9fe;color:#6d28d9;}
  .acct-role.member{background:#e0f2fe;color:#0369a1;}
  .acct-add{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .acct-add h4{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--text);}
  .acct-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .acct-grid .full{grid-column:1 / 3;}

  .form-toggle{
    display:none;width:100%;margin-bottom:16px;padding:13px 0;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:14px;
    font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
    box-shadow:0 4px 12px rgba(139,92,246,.3);
  }

  .team-section{margin-bottom:28px;}
  .team-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .team-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.04);}
  .team-dot.safety{background:var(--safety);}
  .team-dot.edu{background:var(--edu);}
  .team-dot.etc{background:var(--etc);}
  .team-title h2{font-size:19px;margin:0;font-weight:800;}
  .team-title .count{font-size:13px;color:var(--sub);font-weight:600;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:0;}
  .table-scroll table{width:100%;min-width:1010px;table-layout:fixed;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:0;overflow:hidden;box-shadow:var(--shadow-card);}
  .table-scroll th,.table-scroll td{padding:11px 12px;font-size:14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;}
  .table-scroll th{white-space:nowrap;}
  .table-scroll td[data-label="업무 내용"]{font-weight:700;color:var(--text);}
  .table-scroll td[data-label="담당자"],.table-scroll td[data-label="마감일자"],.table-scroll td[data-label="D-Day"],.table-scroll td[data-label="완료일"],.table-scroll td[data-label="상태"]{white-space:nowrap;}
  .table-scroll th{background:linear-gradient(135deg,#f5f3ff,#fdf2f8);color:#7c3aed;font-weight:700;font-size:12px;}
  col.c-report{width:56px;} col.c-owner{width:88px;} col.c-due{width:146px;}
  col.c-dday{width:74px;} col.c-prog{width:152px;} col.c-status{width:78px;}
  col.c-memo{width:88px;} col.c-actions{width:302px;}
  td[data-label="업무 내용"]{word-break:break-word;}
  .table-scroll tr:last-child td{border-bottom:none;}
  .table-scroll tr.row-overdue td{background:#fff1f2;}
  .table-scroll tbody tr:hover td{background:#faf9ff;}

  .progress-cell{display:flex;align-items:center;gap:8px;min-width:0;}
  .bar-bg{flex:1;height:9px;background:#eee9fb;border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;}
  .prog-num{font-size:13px;color:var(--sub);width:38px;text-align:right;font-weight:700;}

  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge.done{background:#dcfce7;color:#15803d;}
  .badge.ongoing{background:#dbeafe;color:#1d4ed8;}
  .badge.overdue{background:#ffe4e6;color:#be123c;}

  .dday{font-size:13px;font-weight:700;}
  .dday.warn{color:var(--orange);}
  .dday.late{color:var(--red);}
  .dday.ok{color:var(--sub);}

  .row-actions{display:flex;gap:5px;flex-wrap:nowrap;}
  .row-actions button{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 9px;font-size:11.5px;cursor:pointer;color:var(--violet);font-weight:600;white-space:nowrap;}
  .row-actions button:hover{background:var(--edu-tint);border-color:var(--violet);}
  .row-actions button.del{color:var(--red);}
  .row-actions button.del:hover{background:#ffe4e6;border-color:#fca5a5;}
  .locked-hint{opacity:.5;font-size:14px;cursor:default;}

  .table-scroll tr.row-completed td{color:var(--sub);}
  .table-scroll tr.row-completed .badge.done{color:var(--green);}

  details.completed-details{margin-top:12px;}
  details.completed-details > summary{cursor:pointer;list-style:none;font-size:13px;color:var(--sub);padding:6px 2px;display:flex;align-items:center;gap:6px;user-select:none;}
  details.completed-details > summary::-webkit-details-marker{display:none;}
  details.completed-details > summary:before{content:'▸';font-size:10px;}
  details.completed-details[open] > summary:before{content:'▾';}
  details.completed-details > summary:hover{color:var(--text);}
  details.completed-details .table-scroll{margin-top:8px;}

  .prog-input{width:60px;}
  .empty{padding:24px;text-align:center;color:var(--sub);font-size:13px;}

  .memo-view-btn{border:1px solid var(--border);background:#f5f4fd;color:#6d28d9;font-weight:700;font-size:12px;padding:4px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .memo-view-btn:hover{background:#e4d8fd;}
  .memo-empty{color:var(--sub);}
  .memo-view{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6;color:var(--text);background:#f7f7fb;border-radius:0;padding:14px 16px;max-height:50vh;overflow-y:auto;}

  .due-cell{display:flex;align-items:center;gap:6px;}
  .hist-link{font-size:12px;color:#6d28d9;cursor:pointer;border:none;background:var(--edu-tint);padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:700;}
  .hist-link:hover{background:#e4d8fd;}
  .hist-link.empty-hist{color:var(--sub);background:#f0f0f5;}

  .modal-overlay{position:fixed;inset:0;background:rgba(76,29,149,.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:0;padding:22px 24px;width:420px;max-width:92vw;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-modal);}
  .modal-box.wide{width:600px;}
  .modal-box h3{margin:0 0 14px;font-size:17px;font-weight:800;color:#6d28d9;}
  .modal-box .field{margin-bottom:12px;}
  .modal-box label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  .modal-box input{width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;}
  .modal-box input:focus{outline:none;border-color:var(--violet);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .modal-actions button{border:none;border-radius:999px;padding:9px 18px;font-size:13px;cursor:pointer;font-weight:700;}
  .btn-primary,.btn-ghost{border:none;border-radius:999px;padding:10px 18px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit;transition:transform .12s,opacity .12s;}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.35);}
  .btn-ghost{background:#f2f0fb;color:var(--text);border:1.5px solid var(--border);}
  .btn-primary:hover,.btn-ghost:hover{transform:translateY(-1px);}
  .btn-ghost:hover{background:var(--edu-tint);border-color:var(--violet);color:var(--violet);}

  .hist-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .hist-table th,.hist-table td{padding:7px 8px;font-size:12px;border-bottom:1px solid var(--border);text-align:left;}
  .hist-table th{color:var(--sub);font-weight:600;}
  .hist-empty{font-size:13px;color:var(--sub);padding:10px 0;}
  .hist-arrow{color:var(--sub);margin:0 4px;}
  .hist-old{text-decoration:line-through;color:var(--sub);}
  .hist-new{font-weight:600;}

  .absence-banner{background:linear-gradient(135deg,#f5f3ff,#fdf2f8);border:1px solid var(--border);border-radius:0;padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow-card);display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;}
  .absence-banner h3{margin:0;font-size:15px;color:#a21caf;font-weight:800;flex-shrink:0;}
  .banner-nav{display:flex;align-items:center;gap:8px;margin-bottom:0;flex-shrink:0;}
  .absence-banner .absence-chips{flex:1 1 260px;}
  .absence-banner .absence-empty{flex:1 1 auto;}
  .banner-nav-label{font-size:13.5px;font-weight:700;color:var(--text);min-width:90px;text-align:center;}
  .banner-today-btn{padding:5px 12px;font-size:11.5px;}
  .absence-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .absence-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;border:none;background:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:transform .1s;}
  .absence-chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .absence-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .absence-chip.safety .dot{background:var(--safety);}
  .absence-chip.edu .dot{background:var(--edu);}
  .absence-chip.etc .dot{background:var(--etc);}
  .absence-empty{color:var(--sub);font-size:13px;}

  .notice-banner:empty{display:none;}
  .notice-banner{background:linear-gradient(135deg,#fff7e6,#fff1f2);border:1px solid var(--border);border-radius:0;padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow-card);}
  .notice-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .notice-banner h3{margin:0;font-size:15.5px;color:#c2410c;font-weight:800;display:flex;align-items:center;gap:8px;}
  .notice-edit-btn{border:2px solid var(--border);background:#fff;border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;color:var(--violet);font-weight:700;}
  .notice-edit-btn:hover{background:var(--edu-tint);border-color:var(--violet);}
  .notice-text{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .notice-updated{display:block;margin-top:10px;font-size:11.5px;color:var(--sub);}

  /* ---------- 개인 전달사항 ---------- */
  .memo-banner:empty{display:none;}
  .memo-banner{background:linear-gradient(135deg,#f0f9ff,#f5f3ff);border:1px solid var(--border);border-radius:0;
    padding:12px 16px;margin-bottom:18px;box-shadow:0 6px 20px rgba(30,20,70,.10);}
  .memo-banner h3{margin:0;font-size:15.5px;color:#0369a1;font-weight:800;display:flex;align-items:center;gap:8px;}
  .memo-mine-count{background:#fecdd3;color:#be123c;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;}
  .memo-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .memo-card{background:var(--card);border:1px solid var(--border);border-radius:0;padding:12px 14px;
    box-shadow:var(--shadow-soft);transition:box-shadow .15s;}
  .memo-card:hover{box-shadow:var(--shadow-card);}
  .memo-card.to-me{border-color:var(--violet);box-shadow:0 1px 2px rgba(139,92,246,.20), 0 10px 22px rgba(139,92,246,.22);}
  .memo-card.is-done{opacity:.9;}
  .memo-card-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:7px;}
  .memo-to{font-size:13.5px;font-weight:800;color:var(--text);}
  .memo-status{border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .memo-status.wait{background:#fef3c7;color:#b45309;}
  .memo-status.done{background:#dcfce7;color:#15803d;}
  .memo-by{font-size:11.5px;color:var(--sub);font-weight:600;}
  .memo-gone{font-size:11px;color:var(--sub);font-weight:600;}
  .memo-manage{margin-left:auto;display:flex;gap:5px;}
  .memo-manage button{border:1.5px solid var(--border);background:transparent;border-radius:999px;padding:4px 10px;
    font-size:11px;cursor:pointer;color:var(--violet);font-weight:700;font-family:inherit;}
  .memo-manage button.del{color:var(--red);}
  .memo-text{font-size:14px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .memo-actions-row{margin-top:10px;}
  .memo-comments{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);
    display:flex;flex-direction:column;gap:6px;}
  .memo-comment{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px;font-size:12.5px;line-height:1.55;}
  .memo-comment .who{font-weight:800;color:var(--violet);flex-shrink:0;}
  .memo-comment .body{color:var(--text);word-break:break-word;flex:0 1 auto;min-width:0;}
  .memo-comment .at{font-size:10.5px;color:var(--sub);font-weight:600;flex-shrink:0;}
  .memo-comment-del{border:none;background:none;color:var(--sub);cursor:pointer;font-size:14px;line-height:1;
    padding:0 2px;flex-shrink:0;margin-left:auto;}
  .memo-comment-del:hover{color:var(--red);}
  .memo-reply{display:flex;gap:7px;margin-top:9px;}
  .memo-reply input{flex:1;min-width:0;padding:8px 12px;border:2px solid var(--border);border-radius:999px;
    font-size:12.5px;font-family:inherit;background:var(--card);color:var(--text);}
  .memo-reply input:focus{outline:none;border-color:var(--violet);}
  .memo-reply .btn-primary{padding:8px 16px;font-size:12.5px;flex-shrink:0;}
  .memo-reply-note{margin-top:8px;font-size:11.5px;color:var(--sub);}
  details.memo-done{margin-top:10px;}
  details.memo-done .memo-list{margin-top:8px;}

  .type-badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .type-badge.inspect{background:#e0e7ff;color:#4338ca;}
  .type-badge.training{background:#fae8ff;color:#a21caf;}
  .type-badge.leave{background:#fef3c7;color:#b45309;}
  .type-badge.etc{background:#ccfbf1;color:#0f766e;}

  .absence-status{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .absence-status.upcoming{background:#dbeafe;color:#1d4ed8;}
  .absence-status.active{background:#ffe4e6;color:#be123c;}
  .absence-status.done{background:#f1f5f9;color:var(--sub);}

  .add-form.absence-form{grid-template-columns:100px 130px 90px 140px 140px 1fr 110px;}

  .report-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .report-header .cal-label{font-size:15px;font-weight:800;min-width:200px;text-align:center;color:#6d28d9;}
  .report-send-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .report-send-row input{flex:1;min-width:220px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;}
  .report-send-row input:focus{outline:none;border-color:var(--violet);}
  .report-send-row button{white-space:nowrap;}
  .report-preview{background:var(--card);border:1px solid var(--border);border-radius:0;padding:20px;font-family:inherit;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-card);color:var(--text);width:100%;}
  textarea.report-editable{resize:vertical;min-height:340px;}
  textarea.report-editable:focus{outline:none;border-color:var(--violet);}
  .report-status{font-size:12px;color:var(--sub);margin:-8px 0 12px;font-weight:600;}
  .report-archive{margin-top:16px;}
  .report-archive-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .report-archive-item{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:0;padding:10px 14px;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow-soft);}
  .report-archive-item:hover{border-color:var(--violet);background:var(--edu-tint);}
  .report-archive-status{color:var(--sub);}
  .report-archive-empty{font-size:13px;color:var(--sub);padding:8px 0;}
  .report-hint{font-size:11.5px;color:var(--sub);margin:-6px 0 12px;}

  .cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .cal-header .cal-label{font-size:17px;font-weight:800;min-width:112px;text-align:center;color:#6d28d9;}
  .cal-nav{background:#fff;border:2px solid var(--border);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--violet);}
  .cal-nav:hover{background:var(--edu-tint);border-color:var(--violet);}
  .cal-today-btn{margin-left:auto;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer;color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(139,92,246,.3);}
  .cal-today-btn:hover{opacity:.9;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:28px;}
  .cal-weekday{text-align:center;font-size:14px;color:var(--sub);font-weight:700;padding:6px 0;min-width:0;}
  .cal-weekday:first-child{color:var(--red);}
  .cal-weekday:last-child{color:var(--blue);}
  .cal-cell{background:var(--card);border:1px solid var(--border);border-radius:0;min-height:112px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow-soft);}
  .cal-cell.cal-other-month{background:#f7f6fc;}
  .cal-cell.cal-other-month .cal-daynum{color:#c7cbd3;}
  .cal-cell.cal-today{border-color:var(--violet);box-shadow:0 0 0 2px rgba(139,92,246,.25);background:var(--edu-tint);}
  .cal-daynum{font-size:14.5px;font-weight:800;color:var(--text);}
  .cal-cell:nth-child(7n+1) .cal-daynum{color:var(--red);}
  .cal-cell:nth-child(7n) .cal-daynum{color:var(--blue);}
  .cal-cell.cal-other-month:nth-child(7n+1) .cal-daynum,
  .cal-cell.cal-other-month:nth-child(7n) .cal-daynum{color:#dfc9c9;}
  .cal-today .cal-daynum{color:var(--violet) !important;}
  .cal-chips{display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;}
  .cal-chip{font-size:13px;padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:none;background:#eef1f5;font-weight:700;line-height:1.25;}
  .cal-chip.safety{background:var(--safety-tint);color:#c2410c;}
  .cal-chip.edu{background:var(--edu-tint);color:#6d28d9;}
  .cal-chip.etc{background:var(--etc-tint);color:#0f766e;}
  .cal-chip-type{opacity:.75;margin-left:3px;font-weight:600;}

  /* ---------- Responsive ---------- */
  /* 태블릿 폭에서는 입력 폼의 고정 컬럼 합계가 화면보다 넓어 가로 스크롤이 생겼다.
     2열로 접어서 화면 안에 들어오게 한다. */
  @media (max-width: 980px){
    .add-form, .add-form.absence-form{grid-template-columns:repeat(2,minmax(0,1fr));}
    .add-form button{grid-column:1 / -1;padding:11px 0;}
  }
  @media (max-width: 900px){
    .summary{grid-template-columns:repeat(3,1fr);}
    /* 칸이 좁아지는 구간에서는 일정 칩을 한 단계 줄여 이름이 잘리지 않게 한다 */
    .cal-chip{font-size:11.5px;padding:4px 7px;}
    .cal-cell{min-height:100px;padding:6px;}
  }

  @media (max-width: 640px){
    .wrap{padding:16px 12px 40px;}
    header{align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
    header > div:first-child{flex:1 1 100%;min-width:0;}
    header h1{font-size:19px;line-height:1.2;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    header p{font-size:12px;}
    .header-right{flex-direction:row;align-items:center;justify-content:space-between;
      flex-wrap:wrap;width:100%;gap:7px;}
    .header-meta{justify-content:flex-start;gap:6px;}
    .header-actions{gap:6px;margin-left:auto;}
    .sync-status{font-size:11px;}
    .today-badge{padding:5px 9px;font-size:11px;white-space:nowrap;}
    .icon-btn{width:30px;height:30px;font-size:13px;}

    .summary{grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px;}
    .stat-card{padding:9px 10px;border-left-width:4px;border-radius:0;box-shadow:var(--shadow-soft);}
    .stat-card .num{font-size:18px;}
    .stat-card .label{font-size:10.5px;margin-top:0;}

    .absence-banner{padding:11px 13px;margin-bottom:14px;gap:6px 10px;}
    .absence-banner h3{font-size:14px;}
    .absence-chip{font-size:11px;padding:5px 10px;}
    .notice-banner{padding:11px 13px;margin-bottom:14px;}
    .notice-banner h3{font-size:14px;}
    .notice-text{font-size:13px;}
    .memo-banner{padding:11px 13px;margin-bottom:14px;}
    .memo-banner h3{font-size:14px;}
    .memo-card{padding:11px 12px;}
    .memo-text{font-size:13.5px;}
    .memo-card-head{gap:5px 8px;}
    .memo-manage{margin-left:0;width:100%;}
    .memo-reply input{font-size:12px;padding:9px 12px;}
    .memo-reply .btn-primary{padding:9px 14px;font-size:12px;}

    .add-form, .add-form.absence-form{grid-template-columns:1fr;padding:12px;gap:8px;margin-bottom:16px;}
    .add-form button{padding:12px 0;margin-top:2px;}
    .form-toggle{display:block;}
    .save-error-bar{padding:11px 14px;gap:10px;}
    .save-error-text{font-size:12.5px;flex:1 1 100%;}
    .save-error-btn{width:100%;padding:11px 0;}
    .auth-box{padding:24px 20px;border-radius:0;}
    .auth-box h2{font-size:19px;}
    .user-chip{padding:5px 11px;font-size:11.5px;}
    .notice-reads{gap:7px 8px;}
    .read-btn{padding:9px 14px;font-size:12px;}
    .acct-grid{grid-template-columns:1fr;}
    .acct-grid .full{grid-column:1;}
    .acct-table thead{display:none;}
    .acct-table, .acct-table tbody, .acct-table tr{display:block;width:100%;}
    .acct-table tr{border-bottom:1px solid var(--border);padding:9px 0;}
    .acct-table td{display:inline;border:none;padding:0 6px 0 0;}
    .acct-table td.acct-actions{display:block;text-align:left;margin-top:7px;}
    .acct-table button{margin:0 4px 0 0;padding:6px 10px;}

    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;overflow-x:visible;}
    .tab{padding:9px 4px;font-size:12px;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis;}

    /* 업무 테이블 -> 요약 카드형으로 전환 (탭하면 상세 펼침) */
    .table-scroll{overflow-x:visible;border-radius:0;border:none !important;box-shadow:none !important;}
    .table-scroll table{min-width:0;table-layout:auto;border:none;box-shadow:none;background:transparent;}
    .table-scroll thead{display:none;}
    .table-scroll colgroup{display:none;}
    .table-scroll table, .table-scroll tbody{display:block;width:100%;}
    .table-scroll tbody tr{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto auto;
      column-gap:10px;row-gap:7px;align-items:center;
      background:var(--card);border:1px solid var(--border);border-radius:0;
      margin-bottom:8px;padding:11px 13px;
      box-shadow:var(--shadow-soft);
      cursor:pointer;
    }
    .table-scroll tbody tr:last-child{margin-bottom:0;}
    .table-scroll tr.row-overdue{background:#fff5f6;border-color:#fecdd3;}
    .table-scroll tr.row-open{border-color:var(--violet);box-shadow:0 6px 18px rgba(139,92,246,.18);}
    .table-scroll td{display:block;padding:0;border:none;background:transparent !important;font-size:12px;text-align:left;white-space:nowrap;min-width:0;}
    .table-scroll tbody tr:hover td{background:transparent !important;}
    .table-scroll td[data-label]::before{content:none;}

    /* 1행: 제목 + 상태 */
    .table-scroll td[data-label="업무 내용"]{
      position:relative;grid-row:1;grid-column:1 / 3;font-size:14px;font-weight:700;
      white-space:normal;line-height:1.35;padding-right:16px;
    }
    .table-scroll td[data-label="업무 내용"]::after{
      content:'▾';position:absolute;right:0;top:3px;
      font-size:10px;color:var(--sub);transition:transform .15s;
    }
    .table-scroll tr.row-open td[data-label="업무 내용"]::after{transform:rotate(180deg);}
    .table-scroll td[data-label="상태"]{grid-row:1;grid-column:3;justify-self:end;}

    /* 2행: 담당자 · D-Day · 마감일 */
    .table-scroll td[data-label="담당자"]{grid-row:2;grid-column:1;color:var(--sub);font-weight:700;font-size:12.5px;}
    .table-scroll td[data-label="D-Day"],
    .table-scroll td[data-label="완료일"]{grid-row:2;grid-column:2;justify-self:end;}
    .table-scroll td[data-label="마감일자"]{grid-row:2;grid-column:3;justify-self:end;color:var(--sub);font-size:12px;}
    .table-scroll td[data-label="마감일자"] .due-cell{display:inline-flex;gap:5px;vertical-align:middle;}
    /* 마감일 / 완료일이 나란히 나와도 헷갈리지 않도록 짧은 라벨을 붙인다 */
    .table-scroll td[data-label="마감일자"]::before{content:'마감 ';font-size:10.5px;color:var(--sub);font-weight:700;}
    .table-scroll td[data-label="완료일"]::before{content:'완료 ';font-size:10.5px;color:var(--sub);font-weight:700;}

    /* 3행: 진행율 */
    .table-scroll td[data-label="진행율"]{grid-row:3;grid-column:1 / 4;}
    .table-scroll .progress-cell{gap:9px;}
    .table-scroll .bar-bg{height:8px;}
    .table-scroll .prog-num{font-size:12px;width:34px;}

    /* 접힘 상태에서 감추는 것들 */
    .table-scroll tbody tr:not(.row-open) td[data-label="기타"],
    .table-scroll tbody tr:not(.row-open) td[data-label="보고서"],
    .table-scroll tbody tr:not(.row-open) td[data-label="관리"],
    .table-scroll tbody tr:not(.row-open) .hist-link{display:none;}

    /* 펼친 상태 */
    .table-scroll td[data-label="기타"]{grid-row:4;grid-column:1 / 4;}
    .table-scroll td[data-label="보고서"]{grid-row:5;grid-column:1 / 4;}
    .table-scroll td[data-label="관리"]{grid-row:6;grid-column:1 / 4;}
    .table-scroll tr.row-open td[data-label="기타"],
    .table-scroll tr.row-open td[data-label="보고서"]{
      display:flex;align-items:center;gap:10px;
      padding-top:8px;border-top:1px solid var(--border);white-space:normal;
    }
    .table-scroll tr.row-open td[data-label="기타"]::before,
    .table-scroll tr.row-open td[data-label="보고서"]::before{
      content:attr(data-label);font-size:11px;font-weight:700;color:var(--sub);flex-shrink:0;min-width:52px;
    }
    .table-scroll tr.row-open td[data-label="관리"]{padding-top:8px;border-top:1px solid var(--border);}
    .row-actions{gap:5px;flex-wrap:wrap;justify-content:flex-start;}
    .row-actions button{padding:7px 11px;font-size:11.5px;}

    .table-scroll td.empty{grid-column:1 / 4;display:block;text-align:center;padding:18px 0;white-space:normal;}
    .table-scroll tbody tr:has(td.empty){cursor:default;}
    .memo-view{max-height:60vh;}

    .cal-header{gap:6px;}
    .cal-header .cal-label{font-size:15px;min-width:86px;}
    .cal-nav{width:26px;height:26px;font-size:13px;}
    .cal-today-btn{padding:5px 9px;font-size:11px;}
    .cal-grid{gap:3px;margin-bottom:20px;}
    .cal-weekday{font-size:12px;padding:3px 0;}
    .cal-cell{min-height:72px;padding:4px;border-radius:0;gap:3px;}
    .cal-daynum{font-size:12px;}
    .cal-chip{font-size:10.5px;padding:2px 5px;border-radius:5px;font-weight:700;}
    .cal-chip-type{display:none;}

    .modal-box{padding:16px;width:92vw;}
  }

  @media (max-width: 400px){
    .summary{gap:6px;}
    .stat-card{padding:8px 8px;}
    .stat-card .num{font-size:16.5px;}
    .stat-card .label{font-size:10px;}
    .cal-cell{min-height:66px;}
    .cal-chip{font-size:10px;padding:2px 4px;}
  }

  /* ============ 다크 테마 (2번 디자인) ============ */

[data-theme="dark"] .cal-cell.cal-other-month:nth-child(7n) .cal-daynum{color:#5a3a44;}

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="pageTitle">업무관리 대시보드</h1>
    </div>
    <div class="header-right">
      <div class="header-meta">
        <div class="today-badge" id="todayBadge"></div>
        <div class="user-chip" id="userChip" style="display:none;"></div>
      </div>
      <div class="header-actions">
        <span class="sync-status" id="syncStatus"></span>
        <button class="icon-btn" onclick="manualRefresh()" title="새로고침">⟳</button>
        <button class="icon-btn" id="accountsBtn" onclick="openAccounts()" title="팀원 계정 관리" style="display:none;">👥</button>
        <button class="icon-btn" id="logoutBtn" onclick="logout()" title="로그아웃">⏻</button>
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="디자인 1번/2번 전환">🌙</button>
        <button class="icon-btn" onclick="openSettings()" title="GitHub 동기화 설정">⚙</button>
      </div>
    </div>
  </header>

  <div class="setup-banner" id="setupBanner" style="display:none;">
    지금은 <b>보기 전용</b>입니다. 확인 체크·댓글·업무 입력을 저장하려면 GitHub 토큰이 필요합니다.
    <button onclick="openSettings()">토큰 입력하기</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="absence-banner" id="absenceBanner"></div>

  <div class="notice-banner" id="noticeBanner"></div>

  <div class="memo-banner" id="memoBanner"></div>

  <button class="form-toggle" id="taskFormToggle" style="display:none;" onclick="toggleAddForm('taskAddForm')">+ 업무 추가</button>

  <div class="add-form" id="taskAddForm">
    <div>
      <label>팀</label>
      <select id="inTeam">
        <option value="safety">안전</option>
        <option value="edu">교육</option>
        <option value="etc">기타</option>
      </select>
    </div>
    <div>
      <label>업무 내용</label>
      <input type="text" id="inTitle" placeholder="예: 소방안전교육 자료 준비">
    </div>
    <div>
      <label>담당자</label>
      <input type="text" id="inOwner" placeholder="담당자">
    </div>
    <div>
      <label>마감일자</label>
      <input type="date" id="inDue">
    </div>
    <div>
      <label>진행율 (%)</label>
      <input type="number" id="inProgress" min="0" max="100" value="0">
    </div>
    <div>
      <label>기타</label>
      <input type="text" id="inMemo" placeholder="세부 내용/특이사항">
    </div>
    <button onclick="addTask()">+ 업무 추가</button>
  </div>

  <button class="form-toggle" id="absenceFormToggle" style="display:none;" onclick="toggleAddForm('absenceAddForm')">+ 일정 추가</button>

  <div class="add-form absence-form" id="absenceAddForm" style="display:none;">
    <div>
      <label>팀</label>
      <select id="absTeam">
        <option value="safety">안전</option>
        <option value="edu">교육</option>
        <option value="etc">기타</option>
      </select>
    </div>
    <div>
      <label>이름</label>
      <input type="text" id="absPerson" placeholder="이름">
    </div>
    <div>
      <label>유형</label>
      <select id="absType">
        <option value="inspect">점검</option>
        <option value="training">교육</option>
        <option value="leave">휴가</option>
        <option value="etc">기타</option>
      </select>
    </div>
    <div>
      <label>시작일</label>
      <input type="date" id="absStart">
    </div>
    <div>
      <label>종료일</label>
      <input type="date" id="absEnd">
    </div>
    <div>
      <label>메모</label>
      <input type="text" id="absMemo" placeholder="목적지/사유 등">
    </div>
    <button onclick="addAbsence()">+ 일정 추가</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="all">전체</div>
    <div class="tab" data-tab="safety">안전</div>
    <div class="tab" data-tab="edu">교육</div>
    <div class="tab" data-tab="etc">기타</div>
    <div class="tab" data-tab="absence">주요 일정</div>
    <div class="tab" data-tab="report">주간업무보고</div>
  </div>

  <div id="content"></div>

</div>

<div class="save-error-bar" id="saveErrorBar" style="display:none;"></div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-box" id="authBox"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const GH_CONFIG_KEY = "ghSyncConfig_v1";
const TEAM_META = {
  safety: {label:"안전", color:"var(--safety)", cls:"safety"},
  edu: {label:"교육", color:"var(--edu)", cls:"edu"},
  etc: {label:"기타", color:"var(--etc)", cls:"etc"}
};
const TYPE_META = {
  inspect: {label:"점검", cls:"inspect"},
  training: {label:"교육", cls:"training"},
  leave: {label:"휴가", cls:"leave"},
  etc: {label:"기타", cls:"etc"}
};
// 이전 유형(외근/출장) 데이터를 새 유형으로 안전하게 이전하기 위한 매핑
const LEGACY_TYPE_MAP = { outside:"etc", trip:"etc" };

function pad2(n){ return String(n).padStart(2,"0"); }
function fmtLocalDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function todayStr(){
  return fmtLocalDate(new Date());
}

function nowTimeLabel(){
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function mondayOf(d){
  const dd = new Date(d);
  const day = dd.getDay(); // 0=일 ... 6=토
  const diff = day === 0 ? -6 : 1 - day; // 월요일로 이동
  dd.setDate(dd.getDate() + diff);
  dd.setHours(0,0,0,0);
  return dd;
}
let weekState = { monday: mondayOf(new Date()) };
function shiftWeek(delta){
  const d = new Date(weekState.monday);
  d.setDate(d.getDate() + delta*7);
  weekState.monday = d;
  renderContent();
}
function goCurrentWeek(){
  weekState.monday = mondayOf(new Date());
  renderContent();
}

const AUTH_KEY = "authSession_v1";
const PBKDF2_ITER = 150000;
const LEGACY_ADMIN_KEY = "isAdminUnlocked_v1"; // 예전 잠금 흔적 정리용

function bytesToHex(bytes){
  return Array.from(bytes).map(b => b.toString(16).padStart(2,"0")).join("");
}
function hexToBytes(hex){
  const out = new Uint8Array(hex.length / 2);
  for(let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i*2, 2), 16);
  return out;
}
function randomSaltHex(){
  return bytesToHex(crypto.getRandomValues(new Uint8Array(16)));
}

// 브라우저 내장 PBKDF2 (네이티브라 15만회도 순식간에 끝난다)
async function derivePasswordHash(password, saltHex, iter){
  const key = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]
  );
  const bits = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt: hexToBytes(saltHex), iterations: iter, hash:"SHA-256" },
    key, 256
  );
  return bytesToHex(new Uint8Array(bits));
}

async function makeCredential(password){
  const salt = randomSaltHex();
  const hash = await derivePasswordHash(password, salt, PBKDF2_ITER);
  return { salt, hash, iter: PBKDF2_ITER };
}

async function verifyPassword(user, password){
  if(!user || !user.salt || !user.hash) return false;
  const hash = await derivePasswordHash(password, user.salt, user.iter || PBKDF2_ITER);
  return hash === user.hash;
}

function findUser(id){
  const key = String(id || "").trim().toLowerCase();
  return users.find(u => String(u.id).toLowerCase() === key) || null;
}

// 로그인은 24시간 유지된다. 로그인한 시각(at)을 함께 저장해두고,
// 하루가 지난 세션은 읽는 순간 만료 처리해서 다시 로그인 화면을 띄운다.
// (하루 안에는 새로고침·탭 닫았다 다시 열기·브라우저 재시작 모두 그대로 유지)
// 예전 판에는 만료가 아예 없어서 "한 번 로그인하면 영원히 통과"였다.
const SESSION_TTL_MS = 24 * 60 * 60 * 1000;

function loadSession(){
  try{
    const raw = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if(!raw || !raw.userId) return null;
    const at = Date.parse(raw.at || "");
    // at 이 없거나(예전 판 세션) 하루가 지났으면 만료다.
    if(!at || Date.now() - at >= SESSION_TTL_MS){ clearSession(); return null; }
    return raw;
  }catch(e){ return null; }
}
function saveSession(user){
  try{
    localStorage.setItem(AUTH_KEY, JSON.stringify({
      userId: user.id, name: user.name, role: user.role, at: new Date().toISOString()
    }));
  }catch(e){ /* 시크릿 모드 등에서 막히면 이번 탭에서만 유지되지 않을 뿐이다 */ }
}
function clearSession(){
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
  try{ sessionStorage.removeItem(AUTH_KEY); }catch(e){}   // 이전 판 흔적 정리
}

// 저장된 세션의 계정이 아직 살아있는지 확인하고 currentUser 를 맞춘다.
// (관리자가 계정을 지웠거나 역할을 바꿨으면 여기서 반영된다)
function syncCurrentUser(){
  const sess = loadSession();
  if(!sess){ currentUser = null; isAdmin = false; return; }
  if(!users.length){
    // 아직 원격 데이터를 못 받아온 단계다. 여기서 세션을 지워버리면
    // 새로고침할 때마다 다시 로그인해야 하므로, 계정 목록이 올 때까지 기다린다.
    currentUser = null; isAdmin = false; return;
  }
  const u = findUser(sess.userId);
  if(!u){ currentUser = null; isAdmin = false; clearSession(); return; }
  currentUser = { id: u.id, name: u.name, role: u.role };
  isAdmin = u.role === "admin";
}

function logout(){
  if(!confirm("로그아웃할까요?")) return;
  clearSession();
  currentUser = null;
  isAdmin = false;
  render();
}
