  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  header h1{
    font-size:28px;margin:0 0 4px;font-weight:800;
    background:linear-gradient(135deg,#6366f1,#8b5cf6 45%,#ec4899);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:-.3px;
  }
  header p{margin:0;color:var(--sub);font-size:13px;}
  .today-badge{background:var(--card);border:2px solid var(--edu);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--text);font-weight:600;box-shadow:0 3px 10px rgba(139,92,246,.15);}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .sync-status{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:600;}
  .sync-status.saving{color:var(--orange);}
  .sync-status.error{color:var(--red);}
  .icon-btn{background:var(--card);border:1px solid var(--border);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--violet);box-shadow:0 2px 6px rgba(99,102,241,.12);}
  .icon-btn:hover{background:var(--edu-tint);transform:translateY(-1px);}
  .modal-box textarea{width:100%;padding:8px 9px;border:2px solid var(--border);border-radius:12px;font-size:12px;font-family:inherit;resize:vertical;}
  .setup-banner{background:linear-gradient(135deg,#fff3e0,#ffe4ec);border:2px solid #ffd39a;border-radius:16px;padding:14px 16px;margin-bottom:22px;font-size:13px;color:#92400e;}
  .setup-banner button{margin-left:8px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border:none;border-radius:999px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:700;}

  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--violet);border-radius:16px;padding:14px 16px;box-shadow:0 10px 28px rgba(30,20,70,.16);transition:transform .15s;}
  .stat-card:hover{transform:translateY(-2px);}
  .stat-card .num{font-size:26px;font-weight:800;}
  .stat-card .label{font-size:12px;color:var(--sub);margin-top:2px;font-weight:600;}
  .stat-card.done{border-left-color:var(--green);background:linear-gradient(180deg,#f0fdf4,var(--card) 40%);}
  .stat-card.done .num{color:var(--green);}
  .stat-card.overdue{border-left-color:var(--red);background:linear-gradient(180deg,#fff1f2,var(--card) 40%);}
  .stat-card.overdue .num{color:var(--red);}
  .stat-card.progress{border-left-color:var(--blue);background:linear-gradient(180deg,#eff6ff,var(--card) 40%);}
  .stat-card.progress .num{color:var(--blue);}

  .tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:none;flex-wrap:wrap;}
  .tab{padding:10px 20px;font-size:15.5px;cursor:pointer;color:var(--sub);border-bottom:none;border-radius:999px;background:#fff;border:2px solid var(--border);user-select:none;font-weight:600;transition:all .15s;box-shadow:0 4px 14px rgba(30,20,70,.1);}
  .tab:hover{border-color:var(--violet);color:var(--violet);}
  .tab.active{color:#fff;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;box-shadow:0 4px 12px rgba(139,92,246,.35);}

  .add-form{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:22px;display:grid;grid-template-columns:100px 1.2fr 90px 130px 90px 1fr 90px;gap:10px;align-items:end;box-shadow:0 10px 28px rgba(30,20,70,.14);}
  .add-form label{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  .add-form input,.add-form select{width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;transition:border-color .15s;}
  .add-form input:focus,.add-form select:focus{outline:none;border-color:var(--violet);}
  .add-form button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;padding:10px 0;font-size:13px;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(139,92,246,.3);}
  .add-form button:hover{opacity:.92;transform:translateY(-1px);}

  .team-section{margin-bottom:28px;}
  .team-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .team-dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.04);}
  .team-dot.safety{background:var(--safety);}
  .team-dot.edu{background:var(--edu);}
  .team-dot.etc{background:var(--etc);}
  .team-title h2{font-size:19px;margin:0;font-weight:800;}
  .team-title .count{font-size:13px;color:var(--sub);font-weight:600;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(30,20,70,.14);}
  th,td{padding:12px 13px;font-size:14.5px;text-align:left;border-bottom:1px solid var(--border);}
  th{background:linear-gradient(135deg,#f5f3ff,#fdf2f8);color:#7c3aed;font-weight:700;font-size:12px;}
  tr:last-child td{border-bottom:none;}
  tr.row-overdue td{background:#fff1f2;}
  tbody tr:hover td{background:#faf9ff;}

  .progress-cell{display:flex;align-items:center;gap:8px;min-width:140px;}
  .bar-bg{flex:1;height:9px;background:#eee9fb;border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;}
  .prog-num{font-size:13px;color:var(--sub);width:38px;text-align:right;font-weight:700;}

  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge.done{background:#dcfce7;color:#15803d;}
  .badge.ongoing{background:#dbeafe;color:#1d4ed8;}
  .badge.overdue{background:#ffe4e6;color:#be123c;}

  .dday{font-size:13px;font-weight:700;}
  .dday.warn{color:var(--orange);}
  .dday.late{color:var(--red);}
  .dday.ok{color:var(--sub);}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .row-actions button{border:2px solid var(--border);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--violet);font-weight:600;}
  .row-actions button:hover{background:var(--edu-tint);border-color:var(--violet);}
  .row-actions button.del{color:var(--red);}
  .row-actions button.del:hover{background:#ffe4e6;border-color:#fca5a5;}
  .locked-hint{opacity:.5;font-size:14px;cursor:default;}

  tr.row-completed td{color:var(--sub);}
  tr.row-completed .badge.done{color:var(--green);}

  details.completed-details{margin-top:12px;}
  details.completed-details > summary{cursor:pointer;list-style:none;font-size:13px;color:var(--sub);padding:6px 2px;display:flex;align-items:center;gap:6px;user-select:none;}
  details.completed-details > summary::-webkit-details-marker{display:none;}
  details.completed-details > summary:before{content:'▸';font-size:10px;}
  details.completed-details[open] > summary:before{content:'▾';}
  details.completed-details > summary:hover{color:var(--text);}
  details.completed-details .table-scroll{margin-top:8px;}

  .prog-input{width:60px;}
  .empty{padding:24px;text-align:center;color:var(--sub);font-size:13px;}

  .memo-cell{display:inline-block;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;color:var(--sub);}

  .due-cell{display:flex;align-items:center;gap:6px;}
  .hist-link{font-size:12px;color:#6d28d9;cursor:pointer;border:none;background:var(--edu-tint);padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:700;}
  .hist-link:hover{background:#e4d8fd;}
  .hist-link.empty-hist{color:var(--sub);background:#f0f0f5;}

  .modal-overlay{position:fixed;inset:0;background:rgba(76,29,149,.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:20px;padding:22px 24px;width:420px;max-width:92vw;max-height:80vh;overflow-y:auto;box-shadow:0 16px 40px rgba(76,29,149,.25);}
  .modal-box h3{margin:0 0 14px;font-size:17px;font-weight:800;color:#6d28d9;}
  .modal-box .field{margin-bottom:12px;}
  .modal-box label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  .modal-box input{width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;}
  .modal-box input:focus{outline:none;border-color:var(--violet);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .modal-actions button{border:none;border-radius:999px;padding:9px 18px;font-size:13px;cursor:pointer;font-weight:700;}
  .modal-actions .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.35);}
  .modal-actions .btn-ghost{background:#f2f0fb;color:var(--text);}

  .hist-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .hist-table th,.hist-table td{padding:7px 8px;font-size:12px;border-bottom:1px solid var(--border);text-align:left;}
  .hist-table th{color:var(--sub);font-weight:600;}
  .hist-empty{font-size:13px;color:var(--sub);padding:10px 0;}
  .hist-arrow{color:var(--sub);margin:0 4px;}
  .hist-old{text-decoration:line-through;color:var(--sub);}
  .hist-new{font-weight:600;}

  .absence-banner{background:linear-gradient(135deg,#f5f3ff,#fdf2f8);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:22px;box-shadow:0 10px 28px rgba(30,20,70,.14);}
  .absence-banner h3{margin:0 0 10px;font-size:15.5px;color:#a21caf;font-weight:800;}
  .absence-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .absence-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13px;border:none;background:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .absence-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .absence-chip.safety .dot{background:var(--safety);}
  .absence-chip.edu .dot{background:var(--edu);}
  .absence-chip.etc .dot{background:var(--etc);}
  .absence-empty{color:var(--sub);font-size:13px;}

  .type-badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .type-badge.inspect{background:#e0e7ff;color:#4338ca;}
  .type-badge.training{background:#fae8ff;color:#a21caf;}
  .type-badge.leave{background:#fef3c7;color:#b45309;}

  .absence-status{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .absence-status.upcoming{background:#dbeafe;color:#1d4ed8;}
  .absence-status.active{background:#ffe4e6;color:#be123c;}
  .absence-status.done{background:#f1f5f9;color:var(--sub);}

  .add-form.absence-form{grid-template-columns:100px 130px 90px 140px 140px 1fr 110px;}

  .report-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .report-header .cal-label{font-size:15px;font-weight:800;min-width:200px;text-align:center;color:#6d28d9;}
  .report-send-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .report-send-row input{flex:1;min-width:220px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;}
  .report-send-row input:focus{outline:none;border-color:var(--violet);}
  .report-send-row button{white-space:nowrap;}
  .report-preview{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;font-family:inherit;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:0 10px 28px rgba(30,20,70,.12);color:var(--text);}

  .cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .cal-header .cal-label{font-size:15px;font-weight:800;min-width:100px;text-align:center;color:#6d28d9;}
  .cal-nav{background:#fff;border:2px solid var(--border);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--violet);}

  .cal-today-btn:hover{opacity:.9;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:28px;}
  .cal-weekday{text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding:4px 0;}
  .cal-weekday:first-child{color:var(--red);}
  .cal-weekday:last-child{color:var(--blue);}
  .cal-cell{background:var(--card);border:1px solid var(--border);border-radius:14px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 12px rgba(30,20,70,.08);}
  .cal-cell.cal-other-month{background:#f7f6fc;}
  .cal-cell.cal-other-month .cal-daynum{color:#c7cbd3;}
  .cal-cell.cal-today{border-color:var(--violet);box-shadow:0 0 0 2px rgba(139,92,246,.25);background:var(--edu-tint);}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--sub);}
  .cal-cell:nth-child(7n+1) .cal-daynum{color:var(--red);}
  .cal-cell:nth-child(7n) .cal-daynum{color:var(--blue);}
  .cal-cell.cal-other-month:nth-child(7n+1) .cal-daynum,
  .cal-cell.cal-other-month:nth-child(7n) .cal-daynum{color:#dfc9c9;}
  .cal-today .cal-daynum{color:var(--violet) !important;}
  .cal-chips{display:flex;flex-direction:column;gap:3px;overflow:hidden;}
  .cal-chip{font-size:10.5px;padding:3px 7px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:none;background:#eef1f5;font-weight:600;}
  .cal-chip.safety{background:var(--safety-tint);color:#c2410c;}
  .cal-chip.edu{background:var(--edu-tint);color:#6d28d9;}
  .cal-chip.etc{background:var(--etc-tint);color:#0f766e;}
  .cal-chip-type{opacity:.7;margin-left:2px;}

  /* ---------- Responsive ---------- */
  @media (max-width: 860px){
    .summary{grid-template-columns:repeat(3,1fr);}
  }

  @media (max-width: 640px){

    .stat-card .num{font-size:19px;}

    .absence-banner{padding:12px;margin-bottom:16px;}

    .add-form, .add-form.absence-form{grid-template-columns:1fr;padding:12px;gap:8px;margin-bottom:16px;}
    .add-form button{padding:12px 0;margin-top:2px;}

    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;margin-bottom:12px;}
    .tab{flex-shrink:0;padding:9px 14px;font-size:13px;white-space:nowrap;}

    /* 업무 테이블 -> 카드형으로 전환 (가로 스크롤 없이 한눈에 보이도록) */

    .table-scroll table{min-width:0;border:none;box-shadow:none;background:transparent;}
    .table-scroll thead{display:none;}
    .table-scroll table, .table-scroll tbody, .table-scroll tr{display:block;width:100%;}
    .table-scroll tbody tr{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;padding:4px 12px;box-shadow:0 3px 10px rgba(99,102,241,.06);}
    .table-scroll tbody tr:last-child{margin-bottom:0;}

    .table-scroll tr td:last-child{border-bottom:none;}

    .row-actions{gap:4px;justify-content:flex-end;}

    .memo-cell{max-width:150px;white-space:normal;text-align:right;}

    .cal-header{gap:6px;}
    .cal-header .cal-label{font-size:13px;min-width:76px;}
    .cal-nav{width:26px;height:26px;font-size:13px;}
    .cal-today-btn{padding:5px 9px;font-size:11px;}
    .cal-grid{gap:3px;margin-bottom:20px;}
    .cal-weekday{font-size:10.5px;padding:2px 0;}
    .cal-cell{min-height:58px;padding:3px;border-radius:6px;gap:2px;}

    .cal-chip{font-size:8.5px;padding:1px 3px;border-radius:3px;}

  }

  @media (max-width: 400px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .cal-cell{min-height:48px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>업무관리 대시보드</h1>
    </div>
    <div class="header-right">
      <div class="today-badge" id="todayBadge"></div>
      <div class="header-actions">
        <span class="sync-status" id="syncStatus"></span>
        <button class="icon-btn" onclick="manualRefresh()" title="새로고침">⟳</button>
        <button class="icon-btn" id="adminToggleBtn" onclick="toggleAdminMode()" title="관리자 모드">🔒</button>
        <button class="icon-btn" onclick="openSettings()" title="GitHub 동기화 설정">⚙</button>
      </div>
    </div>
  </header>

  <div class="setup-banner" id="setupBanner" style="display:none;">
    아직 GitHub 동기화가 설정되지 않았습니다. 설정을 완료해야 팀원들과 데이터가 공유됩니다.
    <button onclick="openSettings()">지금 설정하기</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="absence-banner" id="absenceBanner"></div>

  <div class="add-form" id="taskAddForm">
    <div>
      <label>팀</label>
      <select id="inTeam">
        <option value="safety">안전관리</option>

      <label>담당자</label>
      <input type="text" id="inOwner" placeholder="담당자">
    </div>
    <div>
      <label>마감일자</label>
      <input type="date" id="inDue">
    </div>
    <div>
      <label>진행율 (%)</label>
      <input type="number" id="inProgress" min="0" max="100" value="0">

      <input type="text" id="inMemo" placeholder="세부 내용/특이사항">

    <button onclick="addTask()">+ 업무 추가</button>

  <div class="add-form absence-form" id="absenceAddForm" style="display:none;">
    <div>
      <label>팀</label>
      <select id="absTeam">
        <option value="safety">안전관리</option>

      </select>
    </div>
    <div>
      <label>이름</label>
      <input type="text" id="absPerson" placeholder="이름">
    </div>
    <div>
      <label>유형</label>
      <select id="absType">
        <option value="inspect">점검</option>
        <option value="training">교육</option>
        <option value="leave">휴가</option>
        <option value="etc">기타</option>
      </select>
    </div>
    <div>
      <label>시작일</label>
      <input type="date" id="absStart">
    </div>
    <div>
      <label>종료일</label>
      <input type="date" id="absEnd">
    </div>
    <div>
      <label>메모</label>
      <input type="text" id="absMemo" placeholder="목적지/사유 등">
    </div>

  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="all">전체</div>
    <div class="tab" data-tab="safety">안전관리</div>
    <div class="tab" data-tab="edu">교육</div>
    <div class="tab" data-tab="etc">기타</div>
    <div class="tab" data-tab="absence">주요 일정</div>
    <div class="tab" data-tab="report">주간업무보고</div>

  <div id="content"></div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const GH_CONFIG_KEY = "ghSyncConfig_v1";
const TEAM_META = {
  safety: {label:"안전관리", color:"var(--safety)", cls:"safety"},
  edu: {label:"교육", color:"var(--edu)", cls:"edu"},
  etc: {label:"기타", color:"var(--etc)", cls:"etc"}
};
const TYPE_META = {
  inspect: {label:"점검", cls:"inspect"},
  training: {label:"교육", cls:"training"},
  leave: {label:"휴가", cls:"leave"},
  etc: {label:"기타", cls:"etc"}
};
// 이전 유형(외근/출장) 데이터를 새 유형으로 안전하게 이전하기 위한 매핑
const LEGACY_TYPE_MAP = { outside:"etc", trip:"etc" };

function pad2(n){ return String(n).padStart(2,"0"); }
function fmtLocalDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

function todayStr(){
  return fmtLocalDate(new Date());
}

function nowTimeLabel(){
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function cid(){ return "t" + Math.random().toString(36).slice(2,10); }

function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(str){ return decodeURIComponent(escape(atob(str))); }

let tasks = [];
let absences = [];
let activeTab = "all";
let calState = { year: new Date().getFullYear(), month: new Date().getMonth() };

function mondayOf(d){
  const dd = new Date(d);
  const day = dd.getDay(); // 0=일 ... 6=토
  const diff = day === 0 ? -6 : 1 - day; // 월요일로 이동
  dd.setDate(dd.getDate() + diff);
  dd.setHours(0,0,0,0);
  return dd;
}
let weekState = { monday: mondayOf(new Date()) };
function shiftWeek(delta){
  const d = new Date(weekState.monday);
  d.setDate(d.getDate() + delta*7);
  weekState.monday = d;
  renderContent();
}
function goCurrentWeek(){
  weekState.monday = mondayOf(new Date());
  renderContent();
}
let ghConfig = null;
try{ ghConfig = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || "null"); }catch(e){ ghConfig = null; }
let fileSha = null;
let isSaving = false;
let autoRefreshTimer = null;

// 관리자 모드: 서버 인증이 아닌 화면 UI 잠금입니다 (완전한 보안 아님, 실수 방지용).
const ADMIN_PASSWORD = "safety2026";
const ADMIN_KEY = "isAdminUnlocked_v1";
let isAdmin = localStorage.getItem(ADMIN_KEY) === "1";

function toggleAdminMode(){
  if(isAdmin){
    if(!confirm("관리자 모드를 끌까요? 이후에는 업무 테이블 수정이 잠깁니다.")) return;
    isAdmin = false;
    localStorage.removeItem(ADMIN_KEY);
  } else {
    const input = prompt("관리자 비밀번호를 입력하세요.");
    if(input === null) return;
    if(input !== ADMIN_PASSWORD){
      alert("비밀번호가 올바르지 않습니다.");
      return;
    }
    isAdmin = true;
    localStorage.setItem(ADMIN_KEY, "1");
  }
  updateAdminUI();
  render();
}

function updateAdminUI(){
  const btn = document.getElementById("adminToggleBtn");
  if(btn){
    btn.textContent = isAdmin ? "🔓" : "🔒";
    btn.title = isAdmin ? "관리자 모드 (켜짐) - 클릭 시 끄기" : "관리자 모드 켜기";
  }
  const taskForm = document.getElementById("taskAddForm");
  if(taskForm) taskForm.style.display = (isAdmin && activeTab !== "absence" && activeTab !== "report") ? "grid" : "none";
}

function ghUrl(){
  const pathParts = ghConfig.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${encodeURIComponent(ghConfig.owner)}/${encodeURIComponent(ghConfig.repo)}/contents/${pathParts}`;
}

async function fetchRemoteData(){
  const headers = { "Accept": "application/vnd.github+json" };
  if(ghConfig.token) headers["Authorization"] = `Bearer ${ghConfig.token}`;
  const res = await fetch(`${ghUrl()}?ref=${encodeURIComponent(ghConfig.branch || 'main')}`, { headers });
  if(res.status === 404){
    tasks = [];
    absences = [];
    fileSha = null;
    return { isNew: true };
  }
  if(res.status === 401 || res.status === 403){
    throw new Error("토큰이 유효하지 않거나 권한이 없습니다. 설정을 확인해주세요.");
  }
  if(!res.ok){
    throw new Error(`불러오기 실패 (HTTP ${res.status})`);
  }
  const json = await res.json();
  fileSha = json.sha;
  let data;
  try{
    data = JSON.parse(b64ToUtf8(json.content.replace(/\n/g, '')));
  }catch(e){
    throw new Error("데이터 파일 형식이 올바르지 않습니다.");
  }
  tasks = Array.isArray(data.tasks) ? data.tasks : [];
  absences = Array.isArray(data.absences) ? data.absences : [];
  tasks.forEach(t => { if(!Array.isArray(t.dueHistory)) t.dueHistory = []; });
  absences.forEach(a => { if(!TYPE_META[a.type]) a.type = LEGACY_TYPE_MAP[a.type] || "etc"; });
  return { isNew: false };
}

async function saveRemoteData(message){
  const body = {
    message: message || "업데이트",
    content: utf8ToB64(JSON.stringify({ tasks, absences }, null, 2)),
    branch: ghConfig.branch || "main"
  };
  if(fileSha) body.sha = fileSha;
  const res = await fetch(ghUrl(), {
    method: "PUT",
    headers: {
      "Authorization": `Bearer ${ghConfig.token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if(res.status === 409){
    const err = new Error("충돌");
    err.conflict = true;
    throw err;
  }
  if(!res.ok){
    let msg = `저장 실패 (HTTP ${res.status})`;
    try{ const errJson = await res.json(); if(errJson.message) msg = errJson.message; }catch(e){}
    throw new Error(msg);
  }
  const json = await res.json();
  fileSha = json.content.sha;
}

function setSyncStatus(state, message){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.textContent = message || "";
  el.className = "sync-status" + (state ? " " + state : "");
}

function persist(message){
  if(!ghConfig) return;
  if(!ghConfig.token){
    alert("읽기 전용 모드입니다. 이 기기에서는 저장할 수 없습니다. 편집하려면 설정(⚙)에서 토큰을 입력해주세요.");
    fetchRemoteData().catch(()=>{}).finally(render);
    return;
  }
  isSaving = true;
  setSyncStatus("saving", "저장 중...");
  saveRemoteData(message)
    .then(() => {
      setSyncStatus("idle", "동기화됨 · " + nowTimeLabel());
    })
    .catch(async (err) => {
      if(err && err.conflict){
        alert("다른 사람이 방금 먼저 저장했습니다. 최신 데이터를 다시 불러옵니다. 방금 변경한 내용은 다시 입력해주세요.");
        try{ await fetchRemoteData(); }catch(e){}
        setSyncStatus("error", "충돌 발생 - 다시 불러옴");
      } else {
        alert("저장 실패: " + (err.message || err));
        setSyncStatus("error", "저장 오류");
      }
    })
    .finally(() => {
      isSaving = false;
      render();
    });
}

function updateSetupBanner(){
  const banner = document.getElementById("setupBanner");
  if(!banner) return;
  banner.style.display = ghConfig ? "none" : "block";
}

function openSettings(){
  openModal(`
    <h3>GitHub 동기화 설정</h3>
    <p style="font-size:12px;color:var(--sub);margin:-6px 0 14px;">데이터를 저장할 GitHub 저장소 정보를 입력하세요. 저장소는 미리 만들어 두어야 합니다.</p>
    <div class="field">
      <label>GitHub 사용자명 / 조직</label>
      <input type="text" id="cfgOwner" value="${escapeHtml(ghConfig?.owner || '')}" placeholder="예: myaccount">
    </div>
    <div class="field">
      <label>저장소 이름</label>
      <input type="text" id="cfgRepo" value="${escapeHtml(ghConfig?.repo || '')}" placeholder="예: team-schedule">
    </div>
    <div class="field">
      <label>데이터 파일 경로</label>
      <input type="text" id="cfgPath" value="${escapeHtml(ghConfig?.path || 'data.json')}">
    </div>
    <div class="field">
      <label>브랜치</label>
      <input type="text" id="cfgBranch" value="${escapeHtml(ghConfig?.branch || 'main')}">
    </div>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="cfgToken" value="${escapeHtml(ghConfig?.token || '')}" placeholder="ghp_... 또는 github_pat_...">
      <p style="font-size:11px;color:var(--sub);margin:4px 0 0;">비워두면 읽기 전용 모드로 저장됩니다 (조회만 가능, 추가/수정 불가). 토큰 입력이 계속 실패하는 기기에서 사용하세요.</p>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveSettings()">저장하고 불러오기</button>
    </div>
  `);
}

function saveSettings(){
  const owner = document.getElementById("cfgOwner").value.trim();
  const repo = document.getElementById("cfgRepo").value.trim();
  const path = document.getElementById("cfgPath").value.trim() || "data.json";
  const branch = document.getElementById("cfgBranch").value.trim() || "main";
  const token = document.getElementById("cfgToken").value.trim();
  if(!owner || !repo){
    alert("사용자명과 저장소는 필수입니다.");
    return;
  }
  if(!token && !confirm("토큰 없이 저장하면 읽기 전용 모드로 동작합니다. 업무 추가/수정은 불가능하고 보기만 가능합니다. 계속할까요?")) return;
  ghConfig = { owner, repo, path, branch, token };
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(ghConfig));
  closeModal();
  updateSetupBanner();
  loadInitial();
}

async function loadInitial(){
  if(!ghConfig){
    updateSetupBanner();
    render();
    return;
  }
  setSyncStatus("loading", "불러오는 중...");
  try{
    const result = await fetchRemoteData();
    if(result.isNew && ghConfig.token){
      await saveRemoteData("초기 데이터 파일 생성");
    }
    setSyncStatus("idle", (ghConfig.token ? "동기화됨" : "읽기 전용") + " · " + nowTimeLabel());
  }catch(err){
    setSyncStatus("error", "연결 실패");
    alert("GitHub 연결에 실패했습니다: " + (err.message || err) + "\n설정을 다시 확인해주세요.");
  }
  render();
  startAutoRefresh();
}

async function manualRefresh(){
  if(!ghConfig){ openSettings(); return; }
  if(isSaving) return;
  setSyncStatus("loading", "불러오는 중...");
  try{
    await fetchRemoteData();
    setSyncStatus("idle", "동기화됨 · " + nowTimeLabel());
  }catch(err){
    setSyncStatus("error", "불러오기 실패");
  }
  render();
}

function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async () => {
    if(isSaving || !ghConfig) return;
    try{
      await fetchRemoteData();
      setSyncStatus("idle", (ghConfig.token ? "동기화됨" : "읽기 전용") + " · " + nowTimeLabel());
      render();
    }catch(e){ /* silent on background poll */ }
  }, 30000);
}

function dueInfo(due, progress){
  const today = new Date(todayStr());
  const dueDate = new Date(due);
  const diffDays = Math.round((dueDate - today) / 86400000);
  let status, badgeClass, ddayClass, ddayText;
  if(progress >= 100){
    status = "완료"; badgeClass = "done"; ddayClass = "ok"; ddayText = "완료";
  } else if(diffDays < 0){
    status = "지연"; badgeClass = "overdue"; ddayClass = "late"; ddayText = "D+" + Math.abs(diffDays);
  } else {
    status = "진행중"; badgeClass = "ongoing";
    ddayText = diffDays === 0 ? "D-day" : "D-" + diffDays;
    ddayClass = diffDays <= 3 ? "warn" : "ok";
  }
  return {status, badgeClass, ddayClass, ddayText, overdue: diffDays < 0 && progress < 100};
}

function barColor(progress, overdue){
  if(overdue) return "var(--red)";
  if(progress >= 80) return "var(--green)";
  if(progress >= 40) return "var(--blue)";
  return "var(--orange)";
}

function renderSummary(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.progress>=100).length;
  const overdue = tasks.filter(t=> dueInfo(t.due,t.progress).status==="지연").length;
  const ongoing = total - done - overdue;
  const avg = total ? Math.round(tasks.reduce((s,t)=>s+Number(t.progress),0)/total) : 0;

  const el = document.getElementById("summary");
  el.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">전체 업무</div></div>
    <div class="stat-card done"><div class="num">${done}</div><div class="label">완료</div></div>
    <div class="stat-card"><div class="num">${ongoing}</div><div class="label">진행중</div></div>
    <div class="stat-card overdue"><div class="num">${overdue}</div><div class="label">지연</div></div>
    <div class="stat-card progress"><div class="num">${avg}%</div><div class="label">평균 진행율</div></div>
  `;
}

function taskRow(t, opts){
  opts = opts || {};
  const completed = !!opts.completed;
  const info = dueInfo(t.due, t.progress);
  const color = barColor(t.progress, info.overdue);

  const ddayCell = completed
    ? `<span class="dday ok">${t.completedAt ? fmtLocalDate(new Date(t.completedAt)) : '-'}</span>`
    : `<span class="dday ${info.ddayClass}">${info.ddayText}</span>`;

  const actions = completed
    ? `
        <button onclick="openEditDue('${t.id}')">마감일</button>
        <button onclick="openEditMemo('${t.id}')">기타</button>
        <button onclick="reopenTask('${t.id}')">완료 취소</button>
        <button class="del" onclick="deleteTask('${t.id}')">삭제</button>
      `
    : `
        <button onclick="openEditDue('${t.id}')">마감일</button>
        <button onclick="editProgress('${t.id}')">진행율</button>
        <button onclick="openEditMemo('${t.id}')">기타</button>
        <button onclick="markComplete('${t.id}')">완료 처리</button>
        <button class="del" onclick="deleteTask('${t.id}')">삭제</button>
      `;

  const memoText = t.memo ? escapeHtml(t.memo) : '-';

  return `
    <tr class="${info.overdue && !completed ? 'row-overdue' : ''} ${completed ? 'row-completed' : ''}">
      <td data-label="업무 내용">${escapeHtml(t.title)}</td>
      <td data-label="담당자">${escapeHtml(t.owner || '-')}</td>
      <td data-label="마감일자">
        <div class="due-cell">
          <span>${t.due}</span>
          <span class="hist-link ${t.dueHistory && t.dueHistory.length ? '' : 'empty-hist'}" onclick="openHistory('${t.id}')">이력${t.dueHistory && t.dueHistory.length ? ' ' + t.dueHistory.length : ''}</span>
        </div>
      </td>
      <td data-label="${completed ? '완료일' : 'D-Day'}">${ddayCell}</td>
      <td data-label="진행율">
        <div class="progress-cell">
          <div class="bar-bg"><div class="bar-fill" style="width:${t.progress}%;background:${color};"></div></div>
          <span class="prog-num">${t.progress}%</span>
        </div>
      </td>
      <td data-label="상태"><span class="badge ${info.badgeClass}">${info.status}</span></td>
      <td data-label="기타"><span class="memo-cell" title="${memoText}">${memoText}</span></td>
      ${isAdmin ? `<td data-label="관리"><div class="row-actions">${actions}</div></td>` : ''}
    </tr>
  `;
}

function teamTable(teamKey){
  const meta = TEAM_META[teamKey];
  const all = tasks.filter(t=>t.team===teamKey);
  const active = all.filter(t=>t.progress<100).sort((a,b)=> new Date(a.due) - new Date(b.due));
  const completed = all.filter(t=>t.progress>=100)
    .sort((a,b)=> new Date(b.completedAt || b.due) - new Date(a.completedAt || a.due));

  const colCount = isAdmin ? 8 : 7;

  const activeRows = active.length
    ? active.map(t=>taskRow(t)).join("")
    : `<tr><td colspan="${colCount}" class="empty">등록된 업무가 없습니다.</td></tr>`;

  const completedRows = completed.length
    ? completed.map(t=>taskRow(t, {completed:true})).join("")
    : `<tr><td colspan="${colCount}" class="empty">완료된 업무가 없습니다.</td></tr>`;

  return `
    <div class="team-section">
      <div class="team-title">
        <span class="team-dot ${meta.cls}"></span>
        <h2>${meta.label}</h2>
        <span class="count">(진행 ${active.length}건 · 완료 ${completed.length}건)</span>
      </div>
      <div class="table-scroll" style="border:2px solid #4b5563;border-radius:16px;">
        <table>
          <thead>
            <tr>
              <th>업무 내용</th><th>담당자</th><th>마감일자</th><th>D-Day</th><th>진행율</th><th>상태</th><th>기타</th>${isAdmin ? '<th>관리</th>' : ''}
            </tr>
          </thead>
          <tbody>${activeRows}</tbody>
        </table>
      </div>
      <details class="completed-details">
        <summary>완료된 업무 (${completed.length}건)</summary>
        <div class="table-scroll" style="border:2px solid #4b5563;border-radius:16px;">
          <table>
            <thead>
              <tr>
                <th>업무 내용</th><th>담당자</th><th>마감일자</th><th>완료일</th><th>진행율</th><th>상태</th><th>기타</th>${isAdmin ? '<th>관리</th>' : ''}
              </tr>
            </thead>
            <tbody>${completedRows}</tbody>
          </table>
        </div>
      </details>
    </div>
  `;
}

function absenceStatus(a){
  const today = todayStr();
  if(today < a.start) return {key:"upcoming", label:"예정"};
  if(today > a.end) return {key:"done", label:"종료"};
  return {key:"active", label:"진행중"};
}

    .sort((a,b)=> TEAM_META[a.team].label.localeCompare(TEAM_META[b.team].label));

function buildCalendarMatrix(year, month){
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];

  for(let i = startWeekday - 1; i >= 0; i--){
    const day = daysInPrevMonth - i;
    const d = new Date(year, month - 1, day);
    cells.push({day, dateStr: fmtLocalDate(d), currentMonth:false});
  }
  for(let day = 1; day <= daysInMonth; day++){
    const d = new Date(year, month, day);
    cells.push({day, dateStr: fmtLocalDate(d), currentMonth:true});
  }
  let nextDay = 1;
  while(cells.length < 42){
    const d = new Date(year, month + 1, nextDay);
    cells.push({day: nextDay, dateStr: fmtLocalDate(d), currentMonth:false});
    nextDay++;
  }
  return cells;
}

function renderAbsenceCalendar(){
  const { year, month } = calState;
  const monthLabel = `${year}년 ${month + 1}월`;
  const cells = buildCalendarMatrix(year, month);
  const todayS = todayStr();
  const weekdayLabels = ["일","월","화","수","목","금","토"];

  const weekHeader = weekdayLabels.map(d => `<div class="cal-weekday">${d}</div>`).join("");

  const dayCells = cells.map(c => {
    const dayAbsences = absences.filter(a => a.start <= c.dateStr && c.dateStr <= a.end);
    const chips = dayAbsences.map(a => {
      const meta = TEAM_META[a.team];
      const type = TYPE_META[a.type] || TYPE_META.etc;
      const tip = `${a.person} · ${meta.label} · ${type.label}${a.memo ? ' · ' + a.memo : ''}`;
      return `<div class="cal-chip ${meta.cls}" onclick="openEditAbsence('${a.id}')" title="${escapeHtml(tip)}">${escapeHtml(a.person)}<span class="cal-chip-type">${type.label}</span></div>`;
    }).join("");
    const classes = ["cal-cell"];
    if(!c.currentMonth) classes.push("cal-other-month");
    if(c.dateStr === todayS) classes.push("cal-today");
    return `<div class="${classes.join(" ")}"><div class="cal-daynum">${c.day}</div><div class="cal-chips">${chips}</div></div>`;
  }).join("");

  return `
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
      <div class="cal-label">${monthLabel}</div>
      <button class="cal-nav" onclick="changeMonth(1)">›</button>
      <button class="cal-today-btn" onclick="goToday()">오늘</button>
    </div>
    <div class="cal-grid">
      ${weekHeader}
      ${dayCells}
    </div>
  `;
}

function buildWeeklyReportText(monday){
  const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
  const startStr = fmtLocalDate(monday);
  const endStr = fmtLocalDate(sunday);

  const lines = [];
  lines.push(`[주간업무보고] ${startStr} ~ ${endStr}`);
  lines.push("");

  let totalActive = 0, totalDone = 0, totalOverdue = 0, progressSum = 0, progressCount = 0;

  ["safety","edu","etc"].forEach(teamKey => {
    const meta = TEAM_META[teamKey];
    const teamTasks = tasks.filter(t => t.team === teamKey);
    const doneThisWeek = teamTasks.filter(t => t.progress >= 100 && t.completedAt && fmtLocalDate(new Date(t.completedAt)) >= startStr && fmtLocalDate(new Date(t.completedAt)) <= endStr);
    const dueThisWeek = teamTasks.filter(t => t.progress < 100 && t.due >= startStr && t.due <= endStr);
    const overdue = teamTasks.filter(t => t.progress < 100 && t.due < todayStr());

    teamTasks.forEach(t => { progressSum += Number(t.progress); progressCount++; });
    totalActive += teamTasks.filter(t=>t.progress<100).length;
    totalDone += teamTasks.filter(t=>t.progress>=100).length;
    totalOverdue += overdue.length;

    lines.push(`■ ${meta.label}`);
    lines.push(`- 이번 주 완료: ${doneThisWeek.length}건`);
    doneThisWeek.forEach(t => lines.push(`  · ${t.title} (${t.owner || '-'})`));
    lines.push(`- 이번 주 마감 예정: ${dueThisWeek.length}건`);
    dueThisWeek.forEach(t => lines.push(`  · ${t.title} (${t.owner || '-'}) - ${t.progress}% - ${t.due} 마감`));
    lines.push(`- 지연(마감 초과 미완료): ${overdue.length}건`);
    overdue.forEach(t => lines.push(`  · ${t.title} (${t.owner || '-'}) - ${t.progress}% - ${t.due} 마감이었음`));
    lines.push("");
  });

  const weekAbsences = absences.filter(a => a.start <= endStr && a.end >= startStr);
  lines.push(`■ 주요 일정 (외근/점검/교육/휴가 등, 이번 주)`);
  if(!weekAbsences.length){
    lines.push("- 해당 없음");
  } else {
    weekAbsences.forEach(a => {
      const meta = TEAM_META[a.team];
      const type = TYPE_META[a.type] || TYPE_META.etc;
      lines.push(`- ${a.person} (${meta.label}) - ${type.label} - ${a.start}~${a.end}${a.memo ? ' - ' + a.memo : ''}`);
    });
  }
  lines.push("");

  const avgProgress = progressCount ? Math.round(progressSum / progressCount) : 0;
  lines.push(`■ 전체 요약`);
  lines.push(`- 전체 진행중: ${totalActive}건 / 완료: ${totalDone}건 / 지연: ${totalOverdue}건`);
  lines.push(`- 전체 평균 진행율: ${avgProgress}%`);

  return { subject: `[주간업무보고] ${startStr} ~ ${endStr}`, body: lines.join("\n"), startStr, endStr };
}

function renderWeeklyReport(){
  const report = buildWeeklyReportText(weekState.monday);
  const savedEmail = localStorage.getItem("weeklyReportEmail") || "";
  return `
    <div class="report-header">
      <button class="cal-nav" onclick="shiftWeek(-1)">‹</button>
      <div class="cal-label">${report.startStr} ~ ${report.endStr}</div>
      <button class="cal-nav" onclick="shiftWeek(1)">›</button>
      <button class="cal-today-btn" onclick="goCurrentWeek()">이번 주</button>
    </div>
    <div class="report-send-row">
      <input type="email" id="reportEmail" placeholder="받는사람 이메일 (예: manager@company.com)" value="${escapeHtml(savedEmail)}">
      <button class="btn-primary" onclick="sendWeeklyReport()">이메일로 보내기</button>
    </div>
    <pre class="report-preview">${escapeHtml(report.body)}</pre>
  `;
}

function sendWeeklyReport(){
  const email = document.getElementById("reportEmail").value.trim();
  if(!email){
    alert("받는사람 이메일을 입력해주세요.");
    return;
  }
  localStorage.setItem("weeklyReportEmail", email);
  const report = buildWeeklyReportText(weekState.monday);
  const mailtoUrl = `mailto:${email}?subject=${encodeURIComponent(report.subject)}&body=${encodeURIComponent(report.body)}`;
  window.location.href = mailtoUrl;
}

function changeMonth(delta){
  calState.month += delta;
  if(calState.month < 0){ calState.month = 11; calState.year--; }
  if(calState.month > 11){ calState.month = 0; calState.year++; }
  renderContent();
}

function goToday(){
  const now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth();
  renderContent();
}

function renderContent(){
  const el = document.getElementById("content");
  if(activeTab === "all"){
    el.innerHTML = teamTable("safety") + teamTable("edu") + teamTable("etc");
  } else if(activeTab === "absence"){
    el.innerHTML = renderAbsenceCalendar();
  } else if(activeTab === "report"){
    el.innerHTML = renderWeeklyReport();
  } else {
    el.innerHTML = teamTable(activeTab);
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function render(){
  document.getElementById("todayBadge").textContent = "오늘: " + todayStr();
  updateSetupBanner();
  renderSummary();
  renderAbsenceBanner();
  renderContent();
}

function addTask(){
  if(!isAdmin){ alert("관리자 모드에서만 업무를 추가할 수 있습니다."); return; }
  if(!ghConfig){ openSettings(); return; }
  const team = document.getElementById("inTeam").value;
  const title = document.getElementById("inTitle").value.trim();
  const owner = document.getElementById("inOwner").value.trim();
  const due = document.getElementById("inDue").value;
  const progress = Math.max(0, Math.min(100, Number(document.getElementById("inProgress").value) || 0));
  const memo = document.getElementById("inMemo").value.trim();

  if(!title || !due){
    alert("업무 내용과 마감일자를 입력해주세요.");
    return;
  }
  tasks.push({id: cid(), team, title, owner, due, progress, memo, dueHistory: []});
  document.getElementById("inTitle").value = "";
  document.getElementById("inOwner").value = "";
  document.getElementById("inDue").value = "";
  document.getElementById("inProgress").value = 0;
  document.getElementById("inMemo").value = "";
  render();
  persist(`업무 추가: ${title}`);
}

function editProgress(id){
  if(!isAdmin){ alert("관리자 모드에서만 수정할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const val = prompt(`새 진행율을 입력하세요 (${t.progress}-100):`, t.progress);
  if(val === null) return;
  const num = Math.max(0, Math.min(100, Number(val)));
  if(isNaN(num)) return;
  if(num < t.progress){
    alert(`진행율은 낮출 수 없습니다. 현재 ${t.progress}%보다 낮은 값(${num}%)으로는 수정할 수 없습니다.`);
    return;
  }
  t.progress = num;
  if(num >= 100){ if(!t.completedAt) t.completedAt = new Date().toISOString(); }
  else { delete t.completedAt; }
  render();
  persist(`진행율 수정: ${t.title} → ${num}%`);
}

function markComplete(id){
  if(!isAdmin){ alert("관리자 모드에서만 처리할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.progress = 100;
  t.completedAt = new Date().toISOString();
  render();
  persist(`업무 완료 처리: ${t.title}`);
}

function reopenTask(id){
  if(!isAdmin){ alert("관리자 모드에서만 처리할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  if(!confirm("완료 처리를 취소하고 다시 진행중으로 되돌릴까요?")) return;
  t.progress = 90;
  delete t.completedAt;
  render();
  persist(`업무 완료 취소: ${t.title}`);
}

function deleteTask(id){
  if(!isAdmin){ alert("관리자 모드에서만 삭제할 수 있습니다."); return; }
  if(!confirm("이 업무를 삭제할까요?")) return;
  const removed = tasks.find(t=>t.id===id);
  tasks = tasks.filter(t=>t.id!==id);
  render();
  persist(`업무 삭제: ${removed ? removed.title : id}`);
}

function addAbsence(){
  if(!ghConfig){ openSettings(); return; }
  const team = document.getElementById("absTeam").value;
  const person = document.getElementById("absPerson").value.trim();
  const type = document.getElementById("absType").value;
  const start = document.getElementById("absStart").value;
  const end = document.getElementById("absEnd").value || start;
  const memo = document.getElementById("absMemo").value.trim();

  if(!person || !start){
    alert("이름과 시작일을 입력해주세요.");
    return;
  }
  if(end < start){
    alert("종료일은 시작일보다 빠를 수 없습니다.");
    return;
  }
  absences.push({id: cid(), team, person, type, start, end, memo});
  document.getElementById("absPerson").value = "";
  document.getElementById("absStart").value = "";
  document.getElementById("absEnd").value = "";
  document.getElementById("absMemo").value = "";
  render();
  persist(`일정 추가: ${person}`);
}

function openEditAbsence(id){
  const a = absences.find(x=>x.id===id);
  if(!a) return;
  openModal(`
    <h3>일정 수정</h3>
    <div class="field">
      <label>팀</label>
      <select id="modalAbsTeam">
        <option value="safety" ${a.team==='safety'?'selected':''}>안전관리</option>
        <option value="edu" ${a.team==='edu'?'selected':''}>교육</option>
        <option value="etc" ${a.team==='etc'?'selected':''}>기타</option>
      </select>
    </div>
    <div class="field">
      <label>이름</label>
      <input type="text" id="modalAbsPerson" value="${escapeHtml(a.person)}">
    </div>
    <div class="field">
      <label>유형</label>
      <select id="modalAbsType">
        <option value="inspect" ${a.type==='inspect'?'selected':''}>점검</option>
        <option value="training" ${a.type==='training'?'selected':''}>교육</option>
        <option value="leave" ${a.type==='leave'?'selected':''}>휴가</option>
        <option value="etc" ${a.type==='etc'?'selected':''}>기타</option>
      </select>
    </div>
    <div class="field">
      <label>시작일</label>
      <input type="date" id="modalAbsStart" value="${a.start}">
    </div>
    <div class="field">
      <label>종료일</label>
      <input type="date" id="modalAbsEnd" value="${a.end}">
    </div>
    <div class="field">
      <label>메모</label>
      <input type="text" id="modalAbsMemo" value="${escapeHtml(a.memo || '')}">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" style="margin-right:auto;color:var(--red);" onclick="deleteAbsence('${a.id}')">삭제</button>
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveAbsenceEdit('${a.id}')">저장</button>
    </div>
  `);
}

function saveAbsenceEdit(id){
  const a = absences.find(x=>x.id===id);
  if(!a) return;
  const start = document.getElementById("modalAbsStart").value;
  const end = document.getElementById("modalAbsEnd").value || start;
  const person = document.getElementById("modalAbsPerson").value.trim();
  if(!person || !start){
    alert("이름과 시작일을 입력해주세요.");
    return;
  }
  if(end < start){
    alert("종료일은 시작일보다 빠를 수 없습니다.");
    return;
  }
  a.team = document.getElementById("modalAbsTeam").value;
  a.person = person;
  a.type = document.getElementById("modalAbsType").value;
  a.start = start;
  a.end = end;
  a.memo = document.getElementById("modalAbsMemo").value.trim();
  closeModal();
  render();
  persist(`일정 수정: ${a.person}`);
}

function deleteAbsence(id){
  if(!confirm("이 일정을 삭제할까요?")) return;
  const removed = absences.find(a=>a.id===id);
  absences = absences.filter(a=>a.id!==id);
  closeModal();
  render();
  persist(`일정 삭제: ${removed ? removed.person : id}`);
}

function formatDateTime(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openModal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
}

function openEditDue(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  openModal(`
    <h3>마감일자 수정</h3>
    <div class="field">
      <label>현재 마감일</label>
      <input type="text" value="${t.due}" disabled>
    </div>
    <div class="field">
      <label>새 마감일</label>
      <input type="date" id="modalNewDue" value="${t.due}">
    </div>
    <div class="field">
      <label>변경 사유 (선택)</label>
      <input type="text" id="modalReason" placeholder="예: 현장 사정으로 연기">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveDueEdit('${t.id}')">저장</button>
    </div>
  `);
}

function saveDueEdit(id){
  if(!isAdmin){ alert("관리자 모드에서만 수정할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const newDue = document.getElementById("modalNewDue").value;
  const reason = document.getElementById("modalReason").value.trim();
  if(!newDue){
    alert("새 마감일을 입력해주세요.");
    return;
  }
  let changed = false;
  if(newDue !== t.due){
    if(!Array.isArray(t.dueHistory)) t.dueHistory = [];
    t.dueHistory.push({
      from: t.due,
      to: newDue,
      changedAt: new Date().toISOString(),
      reason: reason || ""
    });
    t.due = newDue;
    changed = true;
  }
  closeModal();
  render();
  if(changed) persist(`마감일 수정: ${t.title}`);
}

function openEditMemo(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  openModal(`
    <h3>기타 내용 수정</h3>
    <div class="field">
      <label>업무: ${escapeHtml(t.title)}</label>
      <textarea id="modalMemo" rows="5" placeholder="세부 내용/특이사항을 입력하세요">${escapeHtml(t.memo || '')}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveMemoEdit('${t.id}')">저장</button>
    </div>
  `);
}

function saveMemoEdit(id){
  if(!isAdmin){ alert("관리자 모드에서만 수정할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const newMemo = document.getElementById("modalMemo").value.trim();
  const changed = newMemo !== (t.memo || '');
  t.memo = newMemo;
  closeModal();
  render();
  if(changed) persist(`기타 내용 수정: ${t.title}`);
}

function openHistory(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const history = (t.dueHistory || []).slice().sort((a,b)=> new Date(b.changedAt) - new Date(a.changedAt));
  const rows = history.length
    ? history.map(h => `
        <tr>
          <td>${formatDateTime(h.changedAt)}</td>
          <td><span class="hist-old">${h.from}</span><span class="hist-arrow">→</span><span class="hist-new">${h.to}</span></td>
          <td>${escapeHtml(h.reason || '-')}</td>
        </tr>
      `).join("")
    : `<tr><td colspan="3" class="hist-empty">마감일 변경 이력이 없습니다.</td></tr>`;

  openModal(`
    <h3>마감일 변경 이력 — ${escapeHtml(t.title)}</h3>
    <table class="hist-table">
      <thead><tr><th>변경일시</th><th>변경 내용</th><th>사유</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">닫기</button>
    </div>
  `);
}

document.getElementById("modalOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "modalOverlay") closeModal();
});

document.getElementById("tabs").addEventListener("click", (e)=>{
  const tabEl = e.target.closest(".tab");
  if(!tabEl) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tabEl.classList.add("active");
  activeTab = tabEl.dataset.tab;
  updateAdminUI();
  document.getElementById("absenceAddForm").style.display = activeTab === "absence" ? "grid" : "none";
  renderContent();
});

updateAdminUI();
loadInitial();
</script>
</body>
</html>
