function setAuthError(msg){
  const el = document.getElementById("authError");
  if(el) el.textContent = msg || "";
}

async function doLogin(){
  const btn = document.getElementById("loginBtn");
  const id = document.getElementById("loginId").value.trim();
  const pw = document.getElementById("loginPw").value;
  if(!id || !pw){ setAuthError("아이디와 비밀번호를 모두 입력해주세요."); return; }
  const user = findUser(id);
  btn.disabled = true; btn.textContent = "확인 중...";
  setAuthError("");
  let ok = false;
  try{ ok = user ? await verifyPassword(user, pw) : false; }
  catch(e){ setAuthError("이 브라우저에서는 로그인 처리를 할 수 없습니다: " + (e.message || e)); }
  btn.disabled = false; btn.textContent = "로그인";
  if(!ok){
    setAuthError("아이디 또는 비밀번호가 올바르지 않습니다.");
    const pwEl = document.getElementById("loginPw");
    if(pwEl){ pwEl.value = ""; pwEl.focus(); }
    return;
  }
  localStorage.setItem("lastLoginId", user.id);
  localStorage.removeItem(LEGACY_ADMIN_KEY);
  saveSession(user);
  syncCurrentUser();
  render();
}

async function createFirstAdmin(){
  const btn = document.getElementById("setupBtn");
  const id = document.getElementById("setupId").value.trim();
  const name = document.getElementById("setupName").value.trim();
  const pw = document.getElementById("setupPw").value;
  const pw2 = document.getElementById("setupPw2").value;
  if(!/^[A-Za-z0-9_.-]{3,20}$/.test(id)){ setAuthError("아이디는 영문·숫자 3~20자로 입력해주세요."); return; }
  if(!name){ setAuthError("이름을 입력해주세요."); return; }
  if(pw.length < 8){ setAuthError("비밀번호는 8자 이상으로 정해주세요."); return; }
  if(pw !== pw2){ setAuthError("비밀번호 확인이 일치하지 않습니다."); return; }

  btn.disabled = true; btn.textContent = "만드는 중...";
  setAuthError("");
  try{
    const cred = await makeCredential(pw);
    const admin = { id, name, role:"admin", ...cred, createdAt: new Date().toISOString(), pwTemp: false };
    users = [admin];
    userDirty.set(admin.id, admin);
    localStorage.setItem("lastLoginId", id);
    localStorage.removeItem(LEGACY_ADMIN_KEY);
    saveSession({ id, name, role:"admin" });
    syncCurrentUser();
    const ok = await persist("관리자 계정 생성: " + name, { immediate: true });
    if(!ok){
      btn.disabled = false; btn.textContent = "관리자 계정 만들기";
      setAuthError("계정을 저장하지 못했습니다. 잠시 후 [관리자 계정 만들기]를 다시 눌러주세요.");
      return;
    }
    render();
  }catch(e){
    btn.disabled = false; btn.textContent = "관리자 계정 만들기";
    setAuthError("계정 생성에 실패했습니다: " + (e.message || e));
  }
}

// ---------- 내 계정 (본인 비밀번호 변경) ----------
// 관리자가 만들어준 초기 비밀번호를 쓰는 동안은 pwTemp 가 true 고,
// 본인이 한 번 바꾸면 false 가 된다.
function usingTempPassword(){
  if(!currentUser) return false;
  const u = findUser(currentUser.id);
  return !!(u && u.pwTemp);
}

function openMyAccount(){
  if(!currentUser) return;
  const u = findUser(currentUser.id);
  if(!u) return;
  const temp = !!u.pwTemp;
  openModal(`
    <h3>내 계정</h3>
    <p class="auth-sub" style="margin:-6px 0 14px;">
      ${escapeHtml(u.name)} · ${escapeHtml(u.id)} · ${u.role === 'admin' ? '관리자' : '팀원'}
    </p>
    ${temp ? `<div class="pw-warn">관리자가 정해준 초기 비밀번호를 쓰고 있습니다. 본인만 아는 비밀번호로 바꿔주세요.</div>` : ''}
    <div class="field">
      <label>현재 비밀번호</label>
      <input type="password" id="pwCur" autocomplete="current-password">
    </div>
    <div class="field">
      <label>새 비밀번호</label>
      <input type="password" id="pwNew" placeholder="8자 이상" autocomplete="new-password">
    </div>
    <div class="field">
      <label>새 비밀번호 확인</label>
      <input type="password" id="pwNew2" autocomplete="new-password">
    </div>
    <p class="auth-error" id="pwError"></p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">닫기</button>
      <button class="btn-primary" id="pwSaveBtn" onclick="changeMyPassword()">비밀번호 변경</button>
    </div>
  `);
  const els = ["pwCur","pwNew","pwNew2"].map(id => document.getElementById(id));
  els.forEach(el => el.addEventListener("keydown", e => { if(e.key === "Enter") changeMyPassword(); }));
  setTimeout(()=>{ els[0].focus(); }, 50);
}

async function changeMyPassword(){
  if(!currentUser) return;
  const u = findUser(currentUser.id);
  if(!u) return;
  const btn = document.getElementById("pwSaveBtn");
  const err = document.getElementById("pwError");
  const setErr = m => { if(err) err.textContent = m || ""; };

  const cur = document.getElementById("pwCur").value;
  const nw  = document.getElementById("pwNew").value;
  const nw2 = document.getElementById("pwNew2").value;

  if(!cur){ setErr("현재 비밀번호를 입력해주세요."); return; }
  if(nw.length < 8){ setErr("새 비밀번호는 8자 이상으로 정해주세요."); return; }
  if(nw !== nw2){ setErr("새 비밀번호 확인이 일치하지 않습니다."); return; }
  if(nw === cur){ setErr("지금 쓰는 비밀번호와 다르게 정해주세요."); return; }
  if(!ghConfig || !ghConfig.token){
    setErr("읽기 전용 모드에서는 비밀번호를 바꿀 수 없습니다. 설정(⚙)에서 토큰을 입력해주세요.");
    return;
  }

  btn.disabled = true; btn.textContent = "확인 중...";
  setErr("");
  try{
    const ok = await verifyPassword(u, cur);
    if(!ok){
      btn.disabled = false; btn.textContent = "비밀번호 변경";
      setErr("현재 비밀번호가 올바르지 않습니다.");
      document.getElementById("pwCur").value = "";
      document.getElementById("pwCur").focus();
      return;
    }
    const cred = await makeCredential(nw);
    Object.assign(u, cred, { pwTemp: false, pwChangedAt: new Date().toISOString() });
    userDirty.set(u.id, u);
    const saved = await persist("비밀번호 변경: " + u.name, { immediate: true });
    if(!saved){
      btn.disabled = false; btn.textContent = "비밀번호 변경";
      setErr("아직 저장되지 않았습니다. 화면 아래 [다시 시도]를 눌러주세요.");
      return;
    }
    closeModal();
    render();
    alert("비밀번호를 변경했습니다.");
  }catch(e){
    btn.disabled = false; btn.textContent = "비밀번호 변경";
    setErr("변경에 실패했습니다: " + (e.message || e));
  }
}

// ---------- 팀원 계정 관리 (관리자 전용) ----------
function openAccounts(){
  if(!isAdmin){ alert("관리자만 계정을 관리할 수 있습니다."); return; }
  const rows = users.map(u => `
    <tr>
      <td><b>${escapeHtml(u.id)}</b></td>
      <td>${escapeHtml(u.name)}</td>
      <td><span class="acct-role ${u.role === 'admin' ? 'admin' : 'member'}">${u.role === 'admin' ? '관리자' : '팀원'}</span>${u.pwTemp ? '<span class="acct-temp" title="초기 비밀번호를 아직 안 바꿨습니다">초기</span>' : ''}</td>
      <td class="acct-actions">
        <button onclick="resetAccountPassword('${escapeHtml(u.id)}')">비번 초기화</button>
        <button onclick="toggleAccountRole('${escapeHtml(u.id)}')">${u.role === 'admin' ? '팀원으로' : '관리자로'}</button>
        <button class="del" onclick="deleteAccount('${escapeHtml(u.id)}')">삭제</button>
      </td>
    </tr>
  `).join("");

  openModal(`
    <h3>팀원 계정 관리</h3>
    <table class="acct-table">
      <colgroup><col class="a-id"><col class="a-name"><col class="a-role"><col></colgroup>
      <thead><tr><th>아이디</th><th>이름</th><th>역할</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="acct-add">
      <h4>계정 추가</h4>
      <div class="acct-grid">
        <div><label>아이디</label><input type="text" id="newAcctId" placeholder="영문/숫자"></div>
        <div><label>이름</label><input type="text" id="newAcctName" placeholder="예: 이재혁"></div>
        <div><label>초기 비밀번호</label><input type="text" id="newAcctPw" placeholder="8자 이상"></div>
        <div><label>역할</label>
          <select id="newAcctRole" style="width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:12px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);">
            <option value="member">팀원</option>
            <option value="admin">관리자</option>
          </select>
        </div>
      </div>
      <p class="auth-error" id="acctError" style="margin-top:8px;"></p>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">닫기</button>
      <button class="btn-primary" id="acctAddBtn" onclick="addAccount()">계정 추가</button>
    </div>
  `, true);
}

function setAcctError(msg){
  const el = document.getElementById("acctError");
  if(el) el.textContent = msg || "";
}

async function addAccount(){
  if(!isAdmin) return;
  const btn = document.getElementById("acctAddBtn");
  const id = document.getElementById("newAcctId").value.trim();
  const name = document.getElementById("newAcctName").value.trim();
  const pw = document.getElementById("newAcctPw").value;
  const role = document.getElementById("newAcctRole").value;
  if(!/^[A-Za-z0-9_.-]{3,20}$/.test(id)){ setAcctError("아이디는 영문·숫자 3~20자로 입력해주세요."); return; }
  if(findUser(id)){ setAcctError("이미 있는 아이디입니다."); return; }
  if(!name){ setAcctError("이름을 입력해주세요."); return; }
  if(pw.length < 8){ setAcctError("초기 비밀번호는 8자 이상으로 정해주세요."); return; }

  btn.disabled = true; btn.textContent = "추가 중...";
  try{
    const cred = await makeCredential(pw);
    const acct = { id, name, role, ...cred, createdAt: new Date().toISOString(), pwTemp: true };
    users.push(acct);
    userDirty.set(acct.id, acct);
    const ok = await persist("계정 추가: " + name, { immediate: true });
    openAccounts();
    if(ok){
      alert(`${name}(${id}) 계정을 만들었습니다.\n초기 비밀번호를 본인에게 전달해주세요: ${pw}`);
    }else{
      alert(`${name}(${id}) 계정을 아직 저장하지 못했습니다.\n화면 아래 [다시 시도]를 눌러 저장한 뒤에 비밀번호를 전달해주세요.`);
    }
  }catch(e){
    btn.disabled = false; btn.textContent = "계정 추가";
    setAcctError("추가 실패: " + (e.message || e));
  }
}

async function resetAccountPassword(id){
  if(!isAdmin) return;
  const u = findUser(id);
  if(!u) return;
  const pw = prompt(`${u.name}(${u.id})의 새 비밀번호를 입력하세요. (8자 이상)`);
  if(pw === null) return;
  if(pw.length < 8){ alert("비밀번호는 8자 이상이어야 합니다."); return; }
  const cred = await makeCredential(pw);
  Object.assign(u, cred, { pwTemp: true });
  userDirty.set(u.id, u);
  const ok = await persist("비밀번호 초기화: " + u.name, { immediate: true });
  openAccounts();
  alert(ok
    ? `${u.name}의 비밀번호를 변경했습니다.\n본인에게 전달해주세요: ${pw}`
    : `${u.name}의 새 비밀번호를 아직 저장하지 못했습니다.\n화면 아래 [다시 시도]를 눌러 저장한 뒤에 전달해주세요.`);
}

async function toggleAccountRole(id){
  if(!isAdmin) return;
  const u = findUser(id);
  if(!u) return;
  const next = u.role === "admin" ? "member" : "admin";
  if(next === "member" && users.filter(x => x.role === "admin").length <= 1){
    alert("관리자가 최소 한 명은 있어야 합니다.");
    return;
  }
  if(!confirm(`${u.name}을(를) ${next === "admin" ? "관리자" : "팀원"}으로 바꿀까요?`)) return;
  u.role = next;
  userDirty.set(u.id, u);
  syncCurrentUser();
  await persist("역할 변경: " + u.name, { immediate: true });
  openAccounts();
}

async function deleteAccount(id){
  if(!isAdmin) return;
  const u = findUser(id);
  if(!u) return;
  if(u.role === "admin" && users.filter(x => x.role === "admin").length <= 1){
    alert("마지막 관리자 계정은 삭제할 수 없습니다.");
    return;
  }
  const memoCount = memos.filter(m => m.toUserId === u.id).length;
  if(!confirm(
    `${u.name}(${u.id}) 계정을 삭제할까요?\n\n` +
    `· 주요 전달사항 확인 기록에서 빠집니다.` +
    (memoCount ? `\n· ${u.name} 앞으로 온 개인 전달사항 ${memoCount}건은 남아있지만, 더 이상 확인 체크를 할 수 없습니다. 필요 없으면 직접 삭제해주세요.` : '')
  )) return;
  users = users.filter(x => x.id !== u.id);
  if(notice && Array.isArray(notice.reads)){
    notice.reads = notice.reads.filter(r => r.userId !== u.id);
    noticeTextDirty = true;
  }
  userDirty.set(u.id, 'DELETE');
  const wasMe = currentUser && currentUser.id === u.id;
  await persist("계정 삭제: " + u.name, { immediate: true });
  if(wasMe){ clearSession(); syncCurrentUser(); render(); return; }
  openAccounts();
}

// 디자인 1번(밝은 톤) / 2번(다크 테크) 전환. 기기별로 localStorage에 저장되어
// 다음 방문 때도 마지막으로 고른 디자인이 유지된다.
const THEME_KEY = "dashboardTheme_v1";
function applyTheme(theme){
  const dark = theme === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "");
  const btn = document.getElementById("themeToggleBtn");
  if(btn){
    btn.textContent = dark ? "☀️" : "🌙";
    btn.title = dark ? "1번 디자인으로 전환" : "2번 디자인으로 전환";
  }
}
function toggleTheme(){
  const current = localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

function updateAdminUI(){
  const chip = document.getElementById("userChip");
  if(chip){
    if(currentUser){
      const temp = usingTempPassword();
      chip.style.display = "";
      chip.className = "user-chip" + (temp ? " pw-temp" : "");
      chip.title = temp ? "초기 비밀번호를 쓰고 있습니다 — 클릭해서 변경하세요" : "내 계정 / 비밀번호 변경";
      chip.onclick = openMyAccount;
      chip.innerHTML = `${escapeHtml(currentUser.name)}<span class="role">${isAdmin ? '관리자' : '팀원'}</span>${temp ? '<span class="pw-dot" aria-label="초기 비밀번호 사용 중"></span>' : ''}`;
    } else {
      chip.style.display = "none";
    }
  }
  const acctBtn = document.getElementById("accountsBtn");
  if(acctBtn) acctBtn.style.display = isAdmin ? "" : "none";
  const outBtn = document.getElementById("logoutBtn");
  if(outBtn) outBtn.style.display = currentUser ? "" : "none";
  syncForms();
}

// 모바일에서는 입력 폼이 화면을 다 차지하지 않도록 버튼 뒤로 접어둔다.
// PC(641px 이상)에서는 기존처럼 항상 펼쳐진 상태를 유지한다.
function isNarrowScreen(){ return window.innerWidth <= 640; }

function applyFormState(formId, toggleId, active, label){
  const form = document.getElementById(formId);
  const btn = document.getElementById(toggleId);
  if(!form || !btn) return;
  if(!active){
    form.style.display = "none";
    btn.style.display = "none";
    form.classList.remove("form-open");
    return;
  }
  if(isNarrowScreen()){
    const open = form.classList.contains("form-open");
    btn.style.display = "block";
    btn.textContent = open ? "닫기" : label;
    form.style.display = open ? "grid" : "none";
  } else {
    btn.style.display = "none";
    form.style.display = "grid";
  }
}

function syncForms(){
  applyFormState("taskAddForm", "taskFormToggle",
    isAdmin && activeTab !== "absence" && activeTab !== "report", "+ 업무 추가");
  applyFormState("absenceAddForm", "absenceFormToggle",
    activeTab === "absence", "+ 일정 추가");
}

function toggleAddForm(formId){
  const form = document.getElementById(formId);
  if(!form) return;
  form.classList.toggle("form-open");
  syncForms();
}

window.addEventListener("resize", syncForms);

function ghUrl(){
  const pathParts = ghConfig.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${encodeURIComponent(ghConfig.owner)}/${encodeURIComponent(ghConfig.repo)}/contents/${pathParts}`;
}

async function fetchRemoteRaw(){
  // 브라우저/중간 캐시가 예전 응답을 돌려주면 낡은 sha 로 저장을 시도하게 되고,
  // 그러면 재시도를 아무리 해도 계속 충돌한다. 그래서 캐시를 우회한다.
  //
  // 주의: 여기에 Cache-Control / Pragma 같은 요청 헤더를 넣으면 안 된다.
  // GitHub API 가 CORS 로 허용하는 요청 헤더 목록에 그 둘이 없어서, 넣는 순간
  // 사전 요청(preflight)이 거부되고 모든 읽기가 실패한다.
  // 캐시 우회는 URL 뒤의 타임스탬프와 fetch 의 cache 옵션만으로 충분하다.
  const headers = { "Accept": "application/vnd.github+json" };
  if(ghConfig.token) headers["Authorization"] = `Bearer ${ghConfig.token}`;
  const url = `${ghUrl()}?ref=${encodeURIComponent(ghConfig.branch || 'main')}&_=${Date.now()}`;
  const res = await fetch(url, { headers, cache: "no-store" });
  if(res.status === 404){
    return { tasks: [], absences: [], reports: [], notice: normalizeNotice(null), users: [], memos: [], sha: null, isNew: true };
  }
  if(res.status === 401 || res.status === 403){
    // 토큰 없이 읽을 때는 시간당 횟수 제한(60회)에 걸릴 수 있다. 원인을 구분해서 알려준다.
    const remaining = res.headers.get("X-RateLimit-Remaining");
    if(!ghConfig.token && remaining === "0"){
      throw new Error("GitHub 조회 횟수 제한에 걸렸습니다. 잠시 후 다시 시도하거나, 설정(⚙)에서 토큰을 넣으면 제한이 크게 늘어납니다.");
    }
    throw new Error("토큰이 유효하지 않거나 권한이 없습니다. 설정을 확인해주세요.");
  }
  lastRemoteReadAt = Date.now();
  if(!res.ok){
    throw new Error(`불러오기 실패 (HTTP ${res.status})`);
  }
  const json = await res.json();
  let data;
  try{
    data = JSON.parse(b64ToUtf8(json.content.replace(/\n/g, '')));
  }catch(e){
    throw new Error("데이터 파일 형식이 올바르지 않습니다.");
  }
  const freshTasks = Array.isArray(data.tasks) ? data.tasks : [];
  const freshAbsences = Array.isArray(data.absences) ? data.absences : [];
  const freshReports = Array.isArray(data.reports) ? data.reports : [];
  const freshNotice = normalizeNotice(data.notice);
  const freshUsers = Array.isArray(data.users) ? data.users : [];
  const freshMemos = (Array.isArray(data.memos) ? data.memos : []).map(normalizeMemo);
  freshTasks.forEach(t => { if(!Array.isArray(t.dueHistory)) t.dueHistory = []; });
  freshAbsences.forEach(a => { if(!TYPE_META[a.type]) a.type = LEGACY_TYPE_MAP[a.type] || "etc"; });
  return { tasks: freshTasks, absences: freshAbsences, reports: freshReports,
           notice: freshNotice, users: freshUsers, memos: freshMemos, sha: json.sha, isNew: false };
}

// 최초 로드/설정 변경 때만 쓰는 "전체 교체". 저장 안 된 로컬 변경이 있으면 사라지므로
// 새로고침 경로에서는 절대 쓰지 말 것 (그쪽은 refreshFromRemote 를 쓴다).
async function loadRemoteData(){
  const fresh = await fetchRemoteRaw();
  dataLoaded = true;
  loadError = null;
  tasks = fresh.tasks;
  absences = fresh.absences;
  reports = fresh.reports;
  notice = fresh.notice;
  users = fresh.users;
  memos = fresh.memos;
  fileSha = fresh.sha;
  taskDirty.clear();
  absenceDirty.clear();
  reportDirty.clear();
  clearMemoDirty();
  noticeTextDirty = false;
  myReadDirty = null;
  userDirty.clear();
  syncCurrentUser();
  return { isNew: fresh.isNew };
}

// freshArr(원격 최신 목록)을 기준으로, 이번 세션에서 아직 저장되지 못한 로컬 변경(dirtyMap)만
// 그 위에 얹어 병합한다. 다른 사람이 그 사이에 추가/수정한 항목은 그대로 유지된다.
// 예전 data.json 에는 notice 에 text/updatedAt 만 있었다. 읽음 확인용 필드를 채워준다.
function normalizeNotice(raw){
  const n = (raw && typeof raw.text === 'string') ? raw : { text:"", updatedAt:null };
  return {
    text: n.text || "",
    updatedAt: n.updatedAt || null,
    noticeId: n.noticeId || (n.text ? "n_legacy" : null),
    reads: Array.isArray(n.reads) ? n.reads : []
  };
}

function normalizeMemo(m){
  return {
    id: m.id,
    toUserId: m.toUserId || "",
    toName: m.toName || "",
    text: m.text || "",
    byUserId: m.byUserId || "",
    byName: m.byName || "",
    createdAt: m.createdAt || null,
    updatedAt: m.updatedAt || null,
    readAt: m.readAt || null,
    comments: Array.isArray(m.comments) ? m.comments.slice() : []
  };
}

function clearMemoDirty(){
  memoDirty.clear();
  memoCommentDirty.clear();
  memoCommentDeleted.clear();
  memoReadDirty.clear();
}

// 원격 최신 목록 위에 내 변경분만 종류별로 다시 얹는다.
// 본문(관리자)·댓글(각자)·확인체크(대상자)가 서로 다른 필드라, 세 사람이 같은
// 전달사항을 동시에 건드려도 서로의 내용이 지워지지 않는다.
function mergeMemos(freshMemos){
  const map = new Map((freshMemos || []).map(m => [m.id, normalizeMemo(m)]));

  memoDirty.forEach((val, id) => {
    if(val === 'DELETE'){ map.delete(id); return; }
    const remote = map.get(id);
    const merged = normalizeMemo(val);
    // 본문·대상은 내 것을 쓰되, 그 사이 남들이 단 댓글과 확인 기록은 살린다
    if(remote){
      merged.comments = remote.comments.slice();
      if(!memoReadDirty.has(id)) merged.readAt = remote.readAt;
    }
    map.set(id, merged);
  });

  memoCommentDirty.forEach(({ memoId, comment }) => {
    const m = map.get(memoId);
    if(!m) return;
    m.comments = m.comments.filter(c => c.id !== comment.id).concat([comment]);
  });

  memoCommentDeleted.forEach(cid => {
    map.forEach(m => { m.comments = m.comments.filter(c => c.id !== cid); });
  });

  memoReadDirty.forEach((at, id) => {
    const m = map.get(id);
    if(m) m.readAt = at;
  });

  const out = Array.from(map.values());
  out.forEach(m => m.comments.sort((a,b) => String(a.at).localeCompare(String(b.at))));
  return out;
}

// 원격 최신 공지 위에 "내가 이번 세션에서 바꾼 것"만 다시 얹는다.
// - 본문을 내가 고쳤으면 내 본문이 이기고,
// - 읽음 기록은 다른 사람이 그 사이에 누른 것까지 살려서 합친다.
function mergeNotice(fresh){
  const f = normalizeNotice(fresh);
  let base;
  if(noticeTextDirty){
    base = {
      text: notice.text,
      updatedAt: notice.updatedAt,
      noticeId: notice.noticeId,
      // 같은 공지라면 남들이 그 사이 누른 확인까지 살리고, 새 공지면 내가 만든 목록을 쓴다
      reads: (f.noticeId === notice.noticeId ? f.reads.slice() : (notice.reads || []).slice())
    };
  } else {
    base = { text: f.text, updatedAt: f.updatedAt, noticeId: f.noticeId, reads: f.reads.slice() };
  }
  if(myReadDirty && currentUser){
    base.reads = base.reads.filter(r => r.userId !== currentUser.id);
    if(myReadDirty === 'ADD'){
      base.reads.push({ userId: currentUser.id, name: currentUser.name, at: new Date().toISOString() });
    }
  }
  return base;
}

function mergeByKey(freshArr, dirtyMap, keyFn){
  const map = new Map(freshArr.map(x => [keyFn(x), x]));
  dirtyMap.forEach((val, key) => {
    if(val === 'DELETE') map.delete(key);
    else map.set(key, val);
  });
  return Array.from(map.values());
}

// 편집이 일어날 때마다 1 씩 올라간다. 저장 요청을 만든 시점 이후에 새 편집이
// 들어왔다면, 저장이 성공해도 그 편집은 아직 반영된 게 아니므로 dirty 를 지우면 안 된다.
let changeSeq = 0;

async function saveRemoteData(message){
  const seqAtSend = changeSeq;
  const body = {
    message: message || "업데이트",
    content: utf8ToB64(JSON.stringify({ tasks, absences, reports, notice, users, memos }, null, 2)),
    branch: ghConfig.branch || "main"
  };
  if(fileSha) body.sha = fileSha;
  const res = await fetch(ghUrl(), {
    method: "PUT",
    headers: {
      "Authorization": `Bearer ${ghConfig.token}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let msg = `저장 실패 (HTTP ${res.status})`;
    try{ const errJson = await res.json(); if(errJson.message) msg = errJson.message; }catch(e){}
    const err = new Error(msg);
    err.status = res.status;
    // 409/422 = 그 사이 누가 먼저 저장함(sha 불일치). 최신본을 받아 병합 후 다시 시도하면 된다.
    if(res.status === 409 || res.status === 422) err.conflict = true;
    // 429(요청 과다) / 5xx(깃허브 일시 장애)도 잠깐 기다렸다 다시 하면 대개 성공한다.
    else if(res.status === 429 || res.status >= 500) err.transient = true;
    throw err;
  }
  const json = await res.json();
  fileSha = json.content.sha;

  if(changeSeq === seqAtSend){
    // 보내는 사이에 새 편집이 없었다 -> 전부 반영 완료
    taskDirty.clear();
    absenceDirty.clear();
    reportDirty.clear();
    clearMemoDirty();
    noticeTextDirty = false;
    myReadDirty = null;
    userDirty.clear();
    pendingMessages = [];
    return true;
  }
  // 보내는 사이에 새 편집이 들어왔다 -> dirty 를 남겨두고 한 번 더 저장하게 한다
  return false;
}

// 재시도해서 해결될 수 있는 오류인가? (네트워크 끊김은 fetch 가 TypeError 를 던진다)
function isRetryableSaveError(err){
  if(!err) return false;
  if(err.conflict || err.transient) return true;
  if(err.name === "TypeError") return true;
  return false;
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

// 아직 서버에 반영되지 못한 내 변경이 남아 있는가?
function hasUnsavedChanges(){
  return taskDirty.size > 0 || absenceDirty.size > 0 || reportDirty.size > 0 ||
         memoDirty.size > 0 || memoCommentDirty.size > 0 || memoCommentDeleted.size > 0 ||
         memoReadDirty.size > 0 || userDirty.size > 0 ||
         noticeTextDirty || !!myReadDirty;
}

// 입력 중이면 화면을 다시 그리지 않는다 (쓰던 글이 날아가지 않도록).
function safeRender(){
  if(isEditingField()) return;
  render();
}

// 원격 최신본을 받아 그 위에 "내가 아직 저장 못 한 변경"만 다시 얹는다.
// 자동 새로고침·수동 새로고침·충돌 재시도 모두 이 경로를 쓴다.
// 예전에는 새로고침이 로컬 변경을 통째로 버려서, 저장이 한 번 실패하면
// 30초 뒤 자동 새로고침에 입력이 조용히 사라졌다.
async function refreshFromRemote(){
  const fresh = await fetchRemoteRaw();
  dataLoaded = true;
  loadError = null;
  tasks    = mergeByKey(fresh.tasks,    taskDirty,    x => x.id);
  absences = mergeByKey(fresh.absences, absenceDirty, x => x.id);
  reports  = mergeByKey(fresh.reports,  reportDirty,  x => x.weekStart);
  notice   = mergeNotice(fresh.notice);
  memos    = mergeMemos(fresh.memos);
  users    = mergeByKey(fresh.users,    userDirty,    u => u.id);
  syncCurrentUser();
  fileSha = fresh.sha;
  safeRender();
  return fresh;
}

// 충돌이 나면 최신 원격본을 받아 그 위에 내 변경만 다시 얹고(rebase) 재시도한다.
// 재시도 간격은 점점 늘리고(지수 백오프) 무작위 흔들림을 줘서, 여러 기기가 같은
// 박자로 계속 부딪히는 상황을 피한다.
async function attemptSaveWithRetry(){
  const MAX = 7;   // 전부 소진해도 약 12초 안에 결론이 나도록 잡았다
  let lastErr = null;
  for(let i = 0; i < MAX; i++){
    isSaving = true;
    setSyncStatus("saving", i === 0 ? "저장 중..." : `다시 저장 중... (${i}/${MAX - 1})`);
    try{
      return await saveRemoteData(currentCommitMessage());
    }catch(err){
      lastErr = err;
      if(!isRetryableSaveError(err)) throw err;
      const backoff = Math.min(3000, 250 * Math.pow(2, i)) * (0.6 + Math.random() * 0.8);
      await wait(backoff);
      try{
        await refreshFromRemote();   // 최신본 위에 내 변경을 다시 얹는다
      }catch(e){
        // 불러오기까지 실패하면 다음 회차에서 다시 시도한다
      }
    }
  }
  throw lastErr || new Error("저장에 실패했습니다.");
}

// 사용자가 입력창(댓글·주간보고 등)에 커서를 두고 있으면 자동 새로고침으로
// 화면을 다시 그리지 않는다. 쓰던 내용이 날아가는 것을 막기 위한 장치.
function isEditingField(){
  const el = document.activeElement;
  if(!el) return false;
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA" ||
         el.tagName === "SELECT" || el.isContentEditable === true;
}

function setSyncStatus(state, message){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.textContent = message || "";
  el.className = "sync-status" + (state ? " " + state : "");
}

// ============================================================
//  저장 스케줄러
//  ------------------------------------------------------------
//  편집할 때마다 곧바로 커밋하면, 빠르게 여러 번 입력하는 것만으로도
//  커밋이 줄줄이 생기고 서로 충돌한다. 짧게 모았다가 한 번에 저장한다.
//   - 마지막 편집 후 0.7초 조용하면 저장
//   - 계속 입력 중이어도 2.5초에 한 번은 저장 (무한 대기 방지)
//   - 계정/비밀번호처럼 즉시성이 중요한 건 immediate 로 바로 저장
// ============================================================
const SAVE_DEBOUNCE_MS = 700;
const SAVE_MAX_WAIT_MS = 2500;

let saveTimer = null;
let firstPendingAt = 0;
let pendingMessages = [];
let saveInFlight = false;
let saveInFlightPromise = Promise.resolve();
let saveAgain = false;
let saveFailed = false;

function currentCommitMessage(){
  if(!pendingMessages.length) return "업데이트";
  if(pendingMessages.length === 1) return pendingMessages[0];
  return `${pendingMessages[0]} 외 ${pendingMessages.length - 1}건`;
}

function persist(message, opts){
  opts = opts || {};
  if(!ghConfig) return Promise.resolve();
  if(!dataLoaded){
    // 원격 파일을 읽지 못한 상태에서 저장하면 기존 내용을 통째로 날릴 수 있다.
    alert("아직 서버에서 데이터를 불러오지 못했습니다. 연결이 복구된 뒤에 다시 시도해주세요.\n(기존 데이터를 덮어쓰지 않도록 저장을 막았습니다)");
    return Promise.resolve(false);
  }
  if(!ghConfig.token){
    alert("읽기 전용 모드입니다. 이 기기에서는 저장할 수 없습니다. 편집하려면 설정(⚙)에서 토큰을 입력해주세요.");
    return refreshFromRemote().catch(()=>{});
  }
  changeSeq++;
  if(message) pendingMessages.push(message);
  if(opts.immediate){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    return runSaveLoop();
  }
  scheduleSave();
  return Promise.resolve();
}

function scheduleSave(){
  const now = Date.now();
  if(!firstPendingAt) firstPendingAt = now;
  if(saveTimer) clearTimeout(saveTimer);
  const waited = now - firstPendingAt;
  const delay = Math.max(0, Math.min(SAVE_DEBOUNCE_MS, SAVE_MAX_WAIT_MS - waited));
  setSyncStatus("saving", "저장 대기 중...");
  saveTimer = setTimeout(() => { saveTimer = null; runSaveLoop(); }, delay);
}

// 실제 네트워크 저장은 항상 한 번에 하나만. 저장 도중 들어온 편집은
// 현재 저장이 끝난 뒤 한 번 더 돌려서 반영한다.
function runSaveLoop(){
  if(saveInFlight){ saveAgain = true; return saveInFlightPromise; }
  saveInFlight = true;
  let ok = false;
  saveInFlightPromise = (async () => {
    try{
      let guard = 0;
      do{
        saveAgain = false;
        if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
        firstPendingAt = 0;
        const flushed = await attemptSaveWithRetry();
        guard++;
        if(flushed && !saveAgain && !hasUnsavedChanges()) break;
      } while(guard < 20);
      saveFailed = false;
      hideSaveError();
      setSyncStatus("idle", "동기화됨 · " + nowTimeLabel());
      // 계속 입력 중이라 위 루프에서 다 못 비웠으면 조금 뒤 한 번 더 저장한다
      if(hasUnsavedChanges()) scheduleSave();
      ok = true;
    }catch(err){
      // 여기까지 왔다면 재시도로도 안 된 것. 입력 내용은 그대로 두고
      // 화면 아래에 다시 시도 버튼을 띄운다. (절대 버리지 않는다)
      saveFailed = true;
      setSyncStatus("error", "저장 실패 — 다시 시도");
      showSaveError(err);
    }finally{
      isSaving = false;
      saveInFlight = false;
      safeRender();
    }
    return ok;
  })();
  return saveInFlightPromise;
}

function retrySaveNow(){
  // 이미 저장이 돌고 있으면 runSaveLoop 가 알아서 한 번 더 돌게 표시만 해준다.
  // 재시도하는 동안에도 알림 바는 남겨둔다 — 저장 안 된 게 있다는 사실이
  // 화면에서 사라지면 사용자가 다 된 줄 알고 창을 닫을 수 있다.
  const bar = document.getElementById("saveErrorBar");
  if(bar && bar.style.display !== "none"){
    bar.innerHTML = `
      <div class="save-error-text"><b>다시 저장하는 중입니다…</b> 입력하신 내용은 그대로 있습니다.</div>
      <button class="save-error-btn" disabled>저장 중…</button>
    `;
  }
  setSyncStatus("saving", "다시 저장 중...");
  runSaveLoop();
}

function showSaveError(err){
  const bar = document.getElementById("saveErrorBar");
  if(!bar) return;
  const reason = (err && (err.message || err)) || "알 수 없는 오류";
  bar.innerHTML = `
    <div class="save-error-text">
      <b>저장하지 못한 변경이 있습니다.</b>
      입력하신 내용은 화면에 그대로 남아 있습니다 — 다시 시도를 눌러주세요.
      <span class="save-error-reason">${escapeHtml(String(reason))}</span>
    </div>
    <button class="save-error-btn" onclick="retrySaveNow()">다시 시도</button>
  `;
  bar.style.display = "flex";
  document.body.classList.add("has-save-error");
}

function hideSaveError(){
  const bar = document.getElementById("saveErrorBar");
  if(bar) bar.style.display = "none";
  document.body.classList.remove("has-save-error");
}

// 저장 안 된 변경이 있는 채로 창을 닫으려 하면 브라우저가 경고를 띄운다.
window.addEventListener("beforeunload", (e) => {
  if(hasUnsavedChanges()){
    e.preventDefault();
    e.returnValue = "";
  }
});

function updateSetupBanner(){
  const banner = document.getElementById("setupBanner");
  if(!banner) return;
  // 저장소 정보는 코드에 내장돼 있으므로, 이제 안내가 필요한 건 "토큰이 없는 상태"뿐이다.
  banner.style.display = (ghConfig && ghConfig.token) ? "none" : "block";
}

function openSettings(){
  openModal(`
    <h3>GitHub 동기화 설정</h3>
    <p style="font-size:12px;color:var(--sub);margin:-6px 0 14px;">저장소 정보는 이미 입력돼 있습니다. <b>아래 토큰만 넣으면</b> 확인 체크·업무 입력이 저장됩니다. 토큰이 없으면 보기만 가능합니다.</p>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="cfgToken" value="${escapeHtml(ghConfig?.token || '')}" placeholder="ghp_... 또는 github_pat_...">
      <p style="font-size:11px;color:var(--sub);margin:4px 0 0;">비워두면 보기 전용입니다 (조회만 가능, 확인 체크·추가·수정 불가).</p>
    </div>
    <details style="margin-top:4px;">
      <summary style="cursor:pointer;font-size:12px;color:var(--sub);font-weight:700;">저장소 정보 (평소에는 건드릴 필요 없습니다)</summary>
      <div style="margin-top:10px;">
        <div class="field">
          <label>GitHub 사용자명 / 조직</label>
          <input type="text" id="cfgOwner" value="${escapeHtml(ghConfig?.owner || '')}" placeholder="예: myaccount">
        </div>
        <div class="field">
          <label>저장소 이름</label>
          <input type="text" id="cfgRepo" value="${escapeHtml(ghConfig?.repo || '')}" placeholder="예: team-schedule">
        </div>
        <div class="field">
          <label>데이터 파일 경로</label>
          <input type="text" id="cfgPath" value="${escapeHtml(ghConfig?.path || 'data.json')}">
        </div>
        <div class="field">
          <label>브랜치</label>
          <input type="text" id="cfgBranch" value="${escapeHtml(ghConfig?.branch || 'main')}">
        </div>
      </div>
    </details>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveSettings()">저장하고 불러오기</button>
    </div>
  `);
}

function saveSettings(){
  const owner = document.getElementById("cfgOwner").value.trim();
  const repo = document.getElementById("cfgRepo").value.trim();
  const path = document.getElementById("cfgPath").value.trim() || "data.json";
  const branch = document.getElementById("cfgBranch").value.trim() || "main";
  const token = document.getElementById("cfgToken").value.trim();
  if(!owner || !repo){
    alert("사용자명과 저장소는 필수입니다.");
    return;
  }
  if(!token && !confirm("토큰 없이 저장하면 보기 전용으로 동작합니다. 확인 체크·댓글·업무 추가/수정이 불가능합니다. 계속할까요?")) return;
  ghConfig = { owner, repo, path, branch, token };
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(ghConfig));
  closeModal();
  updateSetupBanner();
  loadInitial();
}

async function loadInitial(){
  if(!ghConfig){
    updateSetupBanner();
    render();
    return;
  }
  loadError = null;          // 다시 시도할 때는 "불러오는 중" 화면부터 보여준다
  renderAuthGate();
  setSyncStatus("loading", "불러오는 중...");
  try{
    const result = await loadRemoteData();
    if(result.isNew && ghConfig.token && users.length){
      await saveRemoteData("초기 데이터 파일 생성");
    }
    setSyncStatus("idle", (ghConfig.token ? "동기화됨" : "읽기 전용") + " · " + nowTimeLabel());
  }catch(err){
    // 못 읽었으면 "데이터가 없다"가 아니라 "연결이 안 된다"로 다룬다.
    loadError = err && (err.message || String(err));
    setSyncStatus("error", "연결 실패");
  }
  render();
  startAutoRefresh();
}

async function manualRefresh(){
  // 새로고침(읽기)은 토큰이 없어도 된다.
  if(saveInFlight) return;
  // 저장 못 한 변경이 남아 있으면, 새로고침이 아니라 저장을 다시 시도하는 게 맞다.
  // (예전에는 여기서 새로고침을 해버려서 입력이 사라졌다)
  if(saveFailed || hasUnsavedChanges()){
    retrySaveNow();
    return;
  }
  setSyncStatus("loading", "불러오는 중...");
  try{
    await refreshFromRemote();
    setSyncStatus("idle", "동기화됨 · " + nowTimeLabel());
  }catch(err){
    setSyncStatus("error", "불러오기 실패");
  }
}

function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async () => {
    if(!ghConfig) return;
    if(saveInFlight || saveTimer) return;                 // 저장 중이거나 저장 대기 중
    if(hasUnsavedChanges()) return;                       // 아직 못 보낸 내 변경이 있으면 건드리지 않는다
    if(document.hidden) return;                           // 다른 탭을 보고 있으면 쉰다
    if(document.getElementById("modalOverlay").classList.contains("open")) return;
    if(isEditingField()) return;                          // 뭔가 입력 중
    // 토큰이 없으면 익명 조회라 시간당 60회 제한이 있다. 3분에 한 번만 읽는다.
    if(!ghConfig.token && Date.now() - lastRemoteReadAt < 180000) return;
    try{
      await refreshFromRemote();
      setSyncStatus("idle", (ghConfig.token ? "동기화됨" : "읽기 전용") + " · " + nowTimeLabel());
    }catch(e){ /* 백그라운드 폴링은 조용히 실패 */ }
  }, 30000);
}

function dueInfo(due, progress){
  const today = new Date(todayStr());
  const dueDate = new Date(due);
  const diffDays = Math.round((dueDate - today) / 86400000);
  let status, badgeClass, ddayClass, ddayText;
  if(progress >= 100){
    status = "완료"; badgeClass = "done"; ddayClass = "ok"; ddayText = "완료";
  } else if(diffDays < 0){
    status = "지연"; badgeClass = "overdue"; ddayClass = "late"; ddayText = "D+" + Math.abs(diffDays);
  } else {
    status = "진행중"; badgeClass = "ongoing";
    ddayText = diffDays === 0 ? "D-day" : "D-" + diffDays;
    ddayClass = diffDays <= 3 ? "warn" : "ok";
  }
  return {status, badgeClass, ddayClass, ddayText, overdue: diffDays < 0 && progress < 100};
}

function barColor(progress, overdue){
  if(overdue) return "var(--red)";
  if(progress >= 80) return "var(--green)";
  if(progress >= 40) return "var(--blue)";
  return "var(--orange)";
}

function renderSummary(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.progress>=100).length;
  const overdue = tasks.filter(t=> dueInfo(t.due,t.progress).status==="지연").length;
  const ongoing = total - done - overdue;
  const avg = total ? Math.round(tasks.reduce((s,t)=>s+Number(t.progress),0)/total) : 0;

  const el = document.getElementById("summary");
  el.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">전체 업무</div></div>
    <div class="stat-card done"><div class="num">${done}</div><div class="label">완료</div></div>
    <div class="stat-card"><div class="num">${ongoing}</div><div class="label">진행중</div></div>
    <div class="stat-card overdue"><div class="num">${overdue}</div><div class="label">지연</div></div>
    <div class="stat-card progress"><div class="num">${avg}%</div><div class="label">평균 진행율</div></div>
  `;
}

function taskRow(t, opts){
  opts = opts || {};
  const completed = !!opts.completed;
  const info = dueInfo(t.due, t.progress);
  const color = barColor(t.progress, info.overdue);

  const ddayCell = completed
    ? `<span class="dday ok">${t.completedAt ? fmtLocalDate(new Date(t.completedAt)) : '-'}</span>`
    : `<span class="dday ${info.ddayClass}">${info.ddayText}</span>`;

  const actions = completed
    ? `
        <button onclick="openEditDue('${t.id}')" title="마감일 변경">마감일</button>
        <button onclick="openEditMemo('${t.id}')" title="기타 내용 편집">기타</button>
        <button onclick="reopenTask('${t.id}')" title="완료 취소">완료취소</button>
        <button class="del" onclick="deleteTask('${t.id}')" title="삭제">삭제</button>
      `
    : `
        <button onclick="openEditDue('${t.id}')" title="마감일 변경">마감일</button>
        <button onclick="editProgress('${t.id}')" title="진행율 변경">진행율</button>
        <button onclick="openEditMemo('${t.id}')" title="기타 내용 편집">기타</button>
        <button onclick="markComplete('${t.id}')" title="완료 처리">완료</button>
        <button class="del" onclick="deleteTask('${t.id}')" title="삭제">삭제</button>
      `;

  const memoBtn = t.memo
    ? `<button class="memo-view-btn" onclick="viewMemo('${t.id}')">내용보기</button>`
    : `<span class="memo-empty">-</span>`;

  return `
    <tr class="${info.overdue && !completed ? 'row-overdue' : ''} ${completed ? 'row-completed' : ''}" onclick="toggleRowOpen(this, event)">
      ${isAdmin ? `<td data-label="보고서"><input type="checkbox" title="주간업무보고에 포함" ${t.includeInReport !== false ? 'checked' : ''} onchange="toggleReportInclude('${t.id}')"></td>` : ''}
      <td data-label="업무 내용">${escapeHtml(t.title)}</td>
      <td data-label="담당자">${escapeHtml(t.owner || '-')}</td>
      <td data-label="마감일자">
        <div class="due-cell">
          <span>${t.due}</span>
          <span class="hist-link ${t.dueHistory && t.dueHistory.length ? '' : 'empty-hist'}" onclick="openHistory('${t.id}')">이력${t.dueHistory && t.dueHistory.length ? ' ' + t.dueHistory.length : ''}</span>
        </div>
      </td>
      <td data-label="${completed ? '완료일' : 'D-Day'}">${ddayCell}</td>
      <td data-label="진행율">
        <div class="progress-cell">
          <div class="bar-bg"><div class="bar-fill" style="width:${t.progress}%;background:${color};"></div></div>
          <span class="prog-num">${t.progress}%</span>
        </div>
      </td>
      <td data-label="상태"><span class="badge ${info.badgeClass}">${info.status}</span></td>
      <td data-label="기타">${memoBtn}</td>
      ${isAdmin ? `<td data-label="관리"><div class="row-actions">${actions}</div></td>` : ''}
    </tr>
  `;
}

// 표 컬럼 폭을 팀별로 동일하게 고정한다 (팀마다 폭이 달라 보이던 문제 해결).
function tableCols(admin){
  return `<colgroup>${admin ? '<col class="c-report">' : ''}<col><col class="c-owner"><col class="c-due"><col class="c-dday"><col class="c-prog"><col class="c-status"><col class="c-memo">${admin ? '<col class="c-actions">' : ''}</colgroup>`;
}

// 모바일에서는 카드를 탭하면 기타/보고서/관리 영역이 펼쳐진다.
// 버튼·체크박스를 누른 경우에는 펼침이 토글되지 않도록 걸러낸다.
function toggleRowOpen(tr, ev){
  if(window.innerWidth > 640) return;
  if(ev && ev.target && ev.target.closest('button, input, select, textarea, a, .hist-link')) return;
  if(tr.querySelector('td.empty')) return;
  tr.classList.toggle('row-open');
}

function teamTable(teamKey){
  const meta = TEAM_META[teamKey];
  const all = tasks.filter(t=>t.team===teamKey);
  const active = all.filter(t=>t.progress<100).sort((a,b)=> new Date(a.due) - new Date(b.due));
  const completed = all.filter(t=>t.progress>=100)
    .sort((a,b)=> new Date(b.completedAt || b.due) - new Date(a.completedAt || a.due));

  const colCount = isAdmin ? 9 : 7;

  const activeRows = active.length
    ? active.map(t=>taskRow(t)).join("")
    : `<tr><td colspan="${colCount}" class="empty">등록된 업무가 없습니다.</td></tr>`;

  const completedRows = completed.length
    ? completed.map(t=>taskRow(t, {completed:true})).join("")
    : `<tr><td colspan="${colCount}" class="empty">완료된 업무가 없습니다.</td></tr>`;

  return `
    <div class="team-section">
      <div class="team-title">
        <span class="team-dot ${meta.cls}"></span>
        <h2>${meta.label}</h2>
        <span class="count">(진행 ${active.length}건 · 완료 ${completed.length}건)</span>
      </div>
      <div class="table-scroll">
        <table>
          ${tableCols(isAdmin)}
          <thead>
            <tr>
              ${isAdmin ? '<th>보고서</th>' : ''}<th>업무 내용</th><th>담당자</th><th>마감일자</th><th>D-Day</th><th>진행율</th><th>상태</th><th>기타</th>${isAdmin ? '<th>관리</th>' : ''}
            </tr>
          </thead>
          <tbody>${activeRows}</tbody>
        </table>
      </div>
      <details class="completed-details">
        <summary>완료된 업무 (${completed.length}건)</summary>
        <div class="table-scroll">
          <table>
            ${tableCols(isAdmin)}
            <thead>
              <tr>
                ${isAdmin ? '<th>보고서</th>' : ''}<th>업무 내용</th><th>담당자</th><th>마감일자</th><th>완료일</th><th>진행율</th><th>상태</th><th>기타</th>${isAdmin ? '<th>관리</th>' : ''}
              </tr>
            </thead>
            <tbody>${completedRows}</tbody>
          </table>
        </div>
      </details>
    </div>
  `;
}

function absenceStatus(a){
  const today = todayStr();
  if(today < a.start) return {key:"upcoming", label:"예정"};
  if(today > a.end) return {key:"done", label:"종료"};
  return {key:"active", label:"진행중"};
}

let bannerDate = new Date();

function shiftBannerDay(delta){
  bannerDate.setDate(bannerDate.getDate() + delta);
  renderAbsenceBanner();
}

function goBannerToday(){
  bannerDate = new Date();
  renderAbsenceBanner();
}

function renderAbsenceBanner(){
  const dateStr = fmtLocalDate(bannerDate);
  const isToday = dateStr === todayStr();
  const dayList = absences.filter(a => a.start <= dateStr && dateStr <= a.end)
    .sort((a,b)=> TEAM_META[a.team].label.localeCompare(TEAM_META[b.team].label));
  const el = document.getElementById("absenceBanner");
  const label = `${Number(dateStr.slice(5,7))}월 ${Number(dateStr.slice(8,10))}일${isToday ? ' (오늘)' : ''}`;
  const nav = `
    <div class="banner-nav">
      <button class="cal-nav" onclick="shiftBannerDay(-1)" title="전날">‹</button>
      <span class="banner-nav-label">${label}</span>
      <button class="cal-nav" onclick="shiftBannerDay(1)" title="다음날">›</button>
      ${isToday ? '' : '<button class="cal-today-btn banner-today-btn" onclick="goBannerToday()">오늘로</button>'}
    </div>
  `;
  if(!dayList.length){
    el.innerHTML = `<h3>주요 일정</h3>${nav}<div class="absence-empty">해당 날짜에 일정이 없습니다.</div>`;
    return;
  }
  const chips = dayList.map(a => {
    const meta = TEAM_META[a.team];
    const type = TYPE_META[a.type] || TYPE_META.etc;
    const memoPart = a.memo ? ` (${escapeHtml(a.memo)})` : '';
    return `<div class="absence-chip ${meta.cls}" onclick="openEditAbsence('${a.id}')" title="클릭하면 세부 내용을 볼 수 있습니다"><span class="dot"></span>${escapeHtml(a.person)}${memoPart} <span class="type-badge ${type.cls}">${type.label}</span></div>`;
  }).join("");
  el.innerHTML = `<h3>주요 일정 (${dayList.length}명)</h3>${nav}<div class="absence-chips">${chips}</div>`;
}

function noticeReads(){
  return Array.isArray(notice.reads) ? notice.reads : [];
}
function myRead(){
  if(!currentUser) return null;
  return noticeReads().find(r => r.userId === currentUser.id) || null;
}

// 전달사항 아래에 "누가 확인했는지" 줄을 그린다.
function renderNoticeReads(){
  const reads = noticeReads();
  const total = users.length;
  const readIds = new Set(reads.map(r => r.userId));
  const unread = users.filter(u => !readIds.has(u.id));
  const mine = myRead();
  const readOnly = !ghConfig || !ghConfig.token;

  const btn = readOnly
    ? `<button class="read-btn" disabled title="읽기 전용 모드에서는 확인 체크를 저장할 수 없습니다">확인 체크 불가</button>`
    : (mine
      ? `<button class="read-btn done" onclick="toggleNoticeRead()" title="누르면 확인을 취소합니다">✓ 확인함</button>`
      : `<button class="read-btn urgent" onclick="toggleNoticeRead()">확인했습니다</button>`);

  const chips = reads
    .slice()
    .sort((a,b) => String(a.at).localeCompare(String(b.at)))
    .map(r => `<span class="read-chip">${escapeHtml(r.name || r.userId)}<span class="at">${r.at ? formatDateTime(r.at).slice(5) : ''}</span></span>`)
    .join("");

  const unreadChips = unread.length
    ? `<span class="read-sep">미확인</span>` + unread.map(u => `<span class="read-chip unread">${escapeHtml(u.name)}</span>`).join("")
    : "";

  return `
    <div class="notice-reads">
      ${btn}
      <span class="read-count">확인 ${reads.length}/${total}명</span>
      <div class="read-chips">${chips}${unreadChips}</div>
      ${readOnly ? '<span class="read-note">이 기기는 읽기 전용 모드입니다. 설정(⚙)에서 토큰을 넣으면 확인 체크를 할 수 있습니다.</span>' : ''}
    </div>
  `;
}

function renderNoticeBanner(){
  const el = document.getElementById("noticeBanner");
  if(!el) return;
  const hasText = notice && notice.text && notice.text.trim();
  const editBtn = isAdmin ? `<button class="notice-edit-btn" onclick="openEditNotice()">${hasText ? '수정' : '작성'}</button>` : '';
  if(!hasText){
    el.classList.remove('needs-ack');
    if(!isAdmin){ el.innerHTML = ''; return; }
    el.innerHTML = `<div class="notice-head"><h3>주요 전달사항</h3>${editBtn}</div><div class="absence-empty">등록된 전달사항이 없습니다.</div>`;
    return;
  }
  // 로그인한 내가 아직 확인 체크를 안 했으면 배너 전체를 맥박 강조한다.
  const needsAck = !!currentUser && !myRead();
  el.classList.toggle('needs-ack', needsAck);
  const ackBadge = needsAck ? `<span class="ack-badge">확인 필요</span>` : '';
  const updatedLabel = notice.updatedAt ? `<span class="notice-updated">${formatDateTime(notice.updatedAt)} 업데이트</span>` : '';
  el.innerHTML = `
    <div class="notice-head"><h3>주요 전달사항 ${ackBadge}</h3>${editBtn}</div>
    <div class="notice-text">${escapeHtml(notice.text).replace(/\n/g,'<br>')}</div>
    ${updatedLabel}
    ${renderNoticeReads()}
  `;
}

// ============================================================
//  개인 전달사항 (관리자가 팀원 한 명을 지정해서 남기는 메모)
//  - 팀 전체가 볼 수 있고
//  - 확인 체크는 대상자 본인만
//  - 댓글은 로그인한 사람 누구나
// ============================================================
function memoCard(m){
  const isTarget = currentUser && m.toUserId === currentUser.id;
  const canManage = isAdmin || (currentUser && m.byUserId === currentUser.id);
  const readOnly = !ghConfig || !ghConfig.token;
  const done = !!m.readAt;

  // 나에게 온 건데 아직 확인 안 했으면 = 내가 처리해야 할 건. 카드 전체를 맥박 강조한다.
  const needsAck = isTarget && !done;

  const status = done
    ? `<span class="memo-status done">✓ ${escapeHtml(m.toName)} 확인 · ${formatDateTime(m.readAt).slice(5)}</span>`
    : (needsAck
      ? `<span class="ack-badge">확인 필요</span>`
      : `<span class="memo-status wait">미확인</span>`);

  const manageBtns = canManage
    ? `<span class="memo-manage">
         <button onclick="openEditMemoNote('${m.id}')">수정</button>
         <button class="del" onclick="deleteMemoNote('${m.id}')">삭제</button>
       </span>`
    : '';

  const readBtn = (isTarget && !readOnly)
    ? (done
        ? `<button class="read-btn done" onclick="toggleMemoRead('${m.id}')" title="누르면 확인을 취소합니다">✓ 확인함</button>`
        : `<button class="read-btn urgent" onclick="toggleMemoRead('${m.id}')">확인했습니다</button>`)
    : '';

  const comments = m.comments.map(c => {
    const canDel = currentUser && (c.userId === currentUser.id || isAdmin);
    return `
      <div class="memo-comment">
        <span class="who">${escapeHtml(c.name || c.userId)}</span>
        <span class="body">${escapeHtml(c.text).replace(/\n/g,'<br>')}</span>
        <span class="at">${c.at ? formatDateTime(c.at).slice(5) : ''}</span>
        ${canDel && !readOnly ? `<button class="memo-comment-del" title="댓글 삭제" onclick="deleteMemoComment('${m.id}','${c.id}')">×</button>` : ''}
      </div>`;
  }).join("");

  const replyBox = readOnly
    ? `<div class="memo-reply-note">읽기 전용 모드에서는 댓글·확인을 저장할 수 없습니다.</div>`
    : `<div class="memo-reply">
         <input type="text" id="memoDraft_${m.id}" placeholder="댓글 남기기"
                value="${escapeHtml(memoDrafts[m.id] || '')}" maxlength="500"
                oninput="memoDrafts['${m.id}']=this.value"
                onkeydown="if(event.key==='Enter'){addMemoComment('${m.id}');}">
         <button class="btn-primary" onclick="addMemoComment('${m.id}')">등록</button>
       </div>`;

  return `
    <div class="memo-card ${isTarget ? 'to-me' : ''} ${done ? 'is-done' : ''} ${needsAck ? 'needs-ack' : ''}">
      <div class="memo-card-head">
        <span class="memo-to">→ ${escapeHtml(m.toName)}${findUser(m.toUserId) ? '' : ' <span class="memo-gone">(삭제된 계정)</span>'}</span>
        ${status}
        <span class="memo-by">${escapeHtml(m.byName)} · ${m.createdAt ? formatDateTime(m.createdAt).slice(5) : ''}${m.updatedAt && m.updatedAt !== m.createdAt ? ' (수정됨)' : ''}</span>
        ${manageBtns}
      </div>
      <div class="memo-text">${escapeHtml(m.text).replace(/\n/g,'<br>')}</div>
      ${readBtn ? `<div class="memo-actions-row">${readBtn}</div>` : ''}
      ${comments ? `<div class="memo-comments">${comments}</div>` : ''}
      ${replyBox}
    </div>
  `;
}

function renderMemoBanner(){
  const el = document.getElementById("memoBanner");
  if(!el) return;
  if(!memos.length && !isAdmin){ el.innerHTML = ''; return; }

  const addBtn = isAdmin
    ? `<button class="notice-edit-btn" onclick="openNewMemoNote()">+ 작성</button>` : '';

  if(!memos.length){
    el.innerHTML = `<div class="notice-head"><h3>개인 전달사항</h3>${addBtn}</div>
      <div class="absence-empty">등록된 개인 전달사항이 없습니다.</div>`;
    return;
  }

  const byNewest = (a,b) => String(b.createdAt).localeCompare(String(a.createdAt));
  const meFirst = (a,b) => {
    const am = currentUser && a.toUserId === currentUser.id ? 0 : 1;
    const bm = currentUser && b.toUserId === currentUser.id ? 0 : 1;
    return am !== bm ? am - bm : byNewest(a,b);
  };

  const open = memos.filter(m => !m.readAt).sort(meFirst);
  const done = memos.filter(m => m.readAt).sort(meFirst);

  const openHtml = open.length
    ? open.map(memoCard).join("")
    : `<div class="absence-empty">확인 대기 중인 전달사항이 없습니다.</div>`;

  const doneHtml = done.length
    ? `<details class="completed-details memo-done">
         <summary>확인 완료된 전달사항 (${done.length}건)</summary>
         <div class="memo-list">${done.map(memoCard).join("")}</div>
       </details>`
    : '';

  const myOpen = currentUser ? open.filter(m => m.toUserId === currentUser.id).length : 0;
  const mine = myOpen ? `<span class="memo-mine-count urgent">나에게 ${myOpen}건</span>` : '';

  el.innerHTML = `
    <div class="notice-head"><h3>개인 전달사항 ${mine}</h3>${addBtn}</div>
    <div class="memo-list">${openHtml}</div>
    ${doneHtml}
  `;
}

function openNewMemoNote(){ openMemoNoteForm(null); }
function openEditMemoNote(id){
  const m = memos.find(x => x.id === id);
  if(!m) return;
  if(!(isAdmin || (currentUser && m.byUserId === currentUser.id))){ alert("작성자 또는 관리자만 수정할 수 있습니다."); return; }
  openMemoNoteForm(m);
}

function openMemoNoteForm(m){
  if(!isAdmin && !m){ alert("관리자만 작성할 수 있습니다."); return; }
  const opts = users.map(u =>
    `<option value="${escapeHtml(u.id)}" ${m && m.toUserId === u.id ? 'selected' : ''}>${escapeHtml(u.name)} (${escapeHtml(u.id)})</option>`
  ).join("");
  openModal(`
    <h3>${m ? '개인 전달사항 수정' : '개인 전달사항 작성'}</h3>
    <div class="field">

function saveMemoNote(id){
  const toId = document.getElementById("memoTo").value;
  const text = document.getElementById("memoNoteText").value.trim();
  if(!text){ alert("내용을 입력해주세요."); return; }
  const target = findUser(toId);
  if(!target){ alert("받는 사람을 선택해주세요."); return; }
  const now = new Date().toISOString();

  if(id){
    const m = memos.find(x => x.id === id);
    if(!m) return;
    const targetChanged = m.toUserId !== target.id;
    m.toUserId = target.id;
    m.toName = target.name;
    m.text = text;
    m.updatedAt = now;
    if(targetChanged) m.readAt = null; // 받는 사람이 바뀌면 확인 기록은 무효
    memoDirty.set(m.id, m);
    if(targetChanged) memoReadDirty.set(m.id, null);
    closeModal(); render();
    persist("개인 전달사항 수정: " + target.name);
    return;
  }

  const memo = {
    id: "m_" + cid(),
    toUserId: target.id, toName: target.name,
    text,
    byUserId: currentUser ? currentUser.id : "", byName: currentUser ? currentUser.name : "",
    createdAt: now, updatedAt: now, readAt: null, comments: []
  };
  memos.push(memo);
  memoDirty.set(memo.id, memo);
  closeModal(); render();
  persist("개인 전달사항 등록: " + target.name);
}

function buildCalendarMatrix(year, month){
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];

  for(let i = startWeekday - 1; i >= 0; i--){
    const day = daysInPrevMonth - i;
    const d = new Date(year, month - 1, day);
    cells.push({day, dateStr: fmtLocalDate(d), currentMonth:false});
  }
  for(let day = 1; day <= daysInMonth; day++){
    const d = new Date(year, month, day);
    cells.push({day, dateStr: fmtLocalDate(d), currentMonth:true});
  }
  let nextDay = 1;
  while(cells.length < 42){
    const d = new Date(year, month + 1, nextDay);
    cells.push({day: nextDay, dateStr: fmtLocalDate(d), currentMonth:false});
    nextDay++;
  }
  return cells;
}

function renderAbsenceCalendar(){
  const { year, month } = calState;
  const monthLabel = `${year}년 ${month + 1}월`;
  const cells = buildCalendarMatrix(year, month);
  const todayS = todayStr();
  const weekdayLabels = ["일","월","화","수","목","금","토"];

  const weekHeader = weekdayLabels.map(d => `<div class="cal-weekday">${d}</div>`).join("");

  const dayCells = cells.map(c => {
    const dayAbsences = absences.filter(a => a.start <= c.dateStr && c.dateStr <= a.end);
    const chips = dayAbsences.map(a => {
      const meta = TEAM_META[a.team];
      const type = TYPE_META[a.type] || TYPE_META.etc;
      const tip = `${a.person} · ${meta.label} · ${type.label}${a.memo ? ' · ' + a.memo : ''}`;
      return `<div class="cal-chip ${meta.cls}" onclick="openEditAbsence('${a.id}')" title="${escapeHtml(tip)}">${escapeHtml(a.person)}<span class="cal-chip-type">${type.label}</span></div>`;
    }).join("");
    const classes = ["cal-cell"];
    if(!c.currentMonth) classes.push("cal-other-month");
    if(c.dateStr === todayS) classes.push("cal-today");
    return `<div class="${classes.join(" ")}"><div class="cal-daynum">${c.day}</div><div class="cal-chips">${chips}</div></div>`;
  }).join("");

  return `
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
      <div class="cal-label">${monthLabel}</div>
      <button class="cal-nav" onclick="changeMonth(1)">›</button>
      <button class="cal-today-btn" onclick="goToday()">오늘</button>
    </div>
    <div class="cal-grid">
      ${weekHeader}
      ${dayCells}
    </div>
  `;
}

function buildWeeklyReportText(monday){
  const friday = new Date(monday); friday.setDate(friday.getDate() + 4);
  const startStr = fmtLocalDate(monday);
  const endStr = fmtLocalDate(friday);

  const lines = [];
  lines.push(`[주간업무보고] ${startStr} ~ ${endStr}`);
  lines.push("");

  let totalActive = 0, totalDone = 0, totalOverdue = 0, progressSum = 0, progressCount = 0;

  ["safety","etc"].forEach(teamKey => {
    const meta = TEAM_META[teamKey];
    const teamTasks = tasks.filter(t => t.team === teamKey && t.includeInReport !== false);
    const overdue = teamTasks.filter(t => t.progress < 100 && t.due < todayStr());

    teamTasks.forEach(t => { progressSum += Number(t.progress); progressCount++; });
    totalActive += teamTasks.filter(t=>t.progress<100).length;
    totalDone += teamTasks.filter(t=>t.progress>=100).length;
    totalOverdue += overdue.length;

    lines.push(`■ ${meta.label}`);
    if(!teamTasks.length){
      lines.push("등록된 업무가 없습니다.");
    } else {
      teamTasks.forEach((t, idx) => {
        lines.push(`${idx + 1}. ${t.title} (${t.progress}%)`);
        if(t.memo) lines.push(t.memo);
      });
    }
    lines.push("");
  });

  const nextMonday = new Date(monday); nextMonday.setDate(nextMonday.getDate() + 7);
  const nextFriday = new Date(nextMonday); nextFriday.setDate(nextFriday.getDate() + 4);
  const nextStartStr = fmtLocalDate(nextMonday);
  const nextEndStr = fmtLocalDate(nextFriday);

  const formatAbsenceLine = a => {
    const meta = TEAM_META[a.team];
    const type = TYPE_META[a.type] || TYPE_META.etc;
    const dateRange = a.start === a.end ? a.start : `${a.start}~${a.end}`;
    return `- ${a.person} (${meta.label}) - ${type.label} - ${dateRange}${a.memo ? ' - ' + a.memo : ''}`;
  };

  lines.push(`■ 주요 일정 (외근/점검/교육/휴가 등)`);
  lines.push(`[이번주 ${startStr} ~ ${endStr}]`);
  const thisWeekAbsences = absences.filter(a => a.start <= endStr && a.end >= startStr);
  if(!thisWeekAbsences.length) lines.push("- 해당 없음");
  else thisWeekAbsences.forEach(a => lines.push(formatAbsenceLine(a)));

  lines.push(`[다음주 ${nextStartStr} ~ ${nextEndStr}]`);
  const nextWeekAbsences = absences.filter(a => a.start <= nextEndStr && a.end >= nextStartStr);
  if(!nextWeekAbsences.length) lines.push("- 해당 없음");
  else nextWeekAbsences.forEach(a => lines.push(formatAbsenceLine(a)));
  lines.push("");

  const avgProgress = progressCount ? Math.round(progressSum / progressCount) : 0;
  lines.push(`■ 전체 요약`);
  lines.push(`- 전체 진행중: ${totalActive}건 / 완료: ${totalDone}건 / 지연: ${totalOverdue}건`);
  lines.push(`- 전체 평균 진행율: ${avgProgress}%`);

  return { subject: `[주간업무보고] ${startStr} ~ ${endStr}`, body: lines.join("\n"), startStr, endStr };
}

function findReport(weekStartStr){

}

    ? `<div class="report-status">${existing.sentAt ? `📧 ${formatDateTime(existing.sentAt)}에 ${escapeHtml(existing.email||'')}로 발송됨` : `💾 ${formatDateTime(existing.savedAt)}에 저장됨`}</div>`

        </div>
      `).join("")
    : `<div class="report-archive-empty">저장된 지난 보고 기록이 없습니다.</div>`;

  return `
    <div class="report-header">
      <button class="cal-nav" onclick="shiftWeek(-1)">‹</button>
      <div class="cal-label">${generated.startStr} ~ ${generated.endStr}</div>
      <button class="cal-nav" onclick="shiftWeek(1)">›</button>
      <button class="cal-today-btn" onclick="goCurrentWeek()">이번 주</button>
    </div>
    ${statusLine}
    ${editableBlock}
    <details class="completed-details report-archive">
      <summary>지난 주간보고 기록 (${reports.length}건)</summary>
      <div class="report-archive-list">${archiveList}</div>

  `;

function saveWeeklyReport(alsoSend){
  if(!isAdmin){ alert("관리자 모드에서만 저장/발송할 수 있습니다."); return; }
  const email = document.getElementById("reportEmail").value.trim();
  const bodyText = document.getElementById("reportBody").value;

    return;
  }
  const generated = buildWeeklyReportText(weekState.monday);
  const nowIso = new Date().toISOString();
  let entry = findReport(generated.startStr);
  if(!entry){
    entry = { weekStart: generated.startStr, weekEnd: generated.endStr };
    reports.push(entry);
  }
  entry.body = bodyText;
  entry.email = email;
  entry.savedAt = nowIso;
  if(alsoSend) entry.sentAt = nowIso;
  reportDirty.set(entry.weekStart, entry);

  if(email) localStorage.setItem("weeklyReportEmail", email);
  render();

    const mailtoUrl = `mailto:${email}?subject=${encodeURIComponent(generated.subject)}&body=${encodeURIComponent(bodyText)}`;

  }
}

function reportBodyToHtml(bodyText){
  const taskLineRe = /^\d+\.\s.+\(\d+%\)\s*$/;
  return bodyText.split('\n').map(line => {
    const escaped = escapeHtml(line);
    return taskLineRe.test(line) ? `<strong>${escaped}</strong>` : escaped;
  }).join('\n');
}

function exportReportWord(){
  const generated = buildWeeklyReportText(weekState.monday);
  const bodyText = currentReportBodyText();
  const htmlBody = reportBodyToHtml(bodyText).replace(/\n/g, '<br>');
  const doc = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head>
      <meta charset="UTF-8">
      <title>${escapeHtml(generated.subject)}</title>
    </head>
    <body style="font-family:'Malgun Gothic',sans-serif;font-size:11pt;">
      <h2>${escapeHtml(generated.subject)}</h2>
      <p>${htmlBody}</p>
    </body>
    </html>
  `;
  const blob = new Blob(['﻿', doc], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `주간업무보고_${generated.startStr}_${generated.endStr}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function changeMonth(delta){
  calState.month += delta;
  if(calState.month < 0){ calState.month = 11; calState.year--; }
  if(calState.month > 11){ calState.month = 0; calState.year++; }
  renderContent();
}

function goToday(){
  const now = new Date();
  calState.year = now.getFullYear();
  calState.month = now.getMonth();
  renderContent();
}

function renderContent(){
  const el = document.getElementById("content");
  if(activeTab === "all"){
    el.innerHTML = teamTable("safety") + teamTable("edu") + teamTable("etc");
  } else if(activeTab === "absence"){
    el.innerHTML = renderAbsenceCalendar();
  } else if(activeTab === "report"){
    el.innerHTML = renderWeeklyReport();
  } else {
    el.innerHTML = teamTable(activeTab);
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function render(){
  syncCurrentUser();
  updateAdminUI();
  // 로그인 전에는 대시보드를 그리지 않고 게이트 화면만 띄운다.
  if(!renderAuthGate()) return;
  document.getElementById("todayBadge").textContent = "오늘: " + todayStr();
  document.getElementById("pageTitle").textContent = `업무관리 대시보드: ${new Date().getMonth() + 1}월`;
  updateSetupBanner();
  renderSummary();
  renderAbsenceBanner();
  renderNoticeBanner();
  renderMemoBanner();
  renderContent();
  updateAckTitle();
}

// 탭을 켜두고 다른 일을 하고 있어도 알 수 있게, 내가 확인 안 한 건수를
// 브라우저 탭 제목 앞에 붙인다. (0건이면 원래 제목으로 되돌림)
var BASE_TITLE = null;
function updateAckTitle(){
  if(BASE_TITLE === null) BASE_TITLE = document.title.replace(/^\(\d+\)\s*/, '');
  let n = 0;
  if(currentUser){
    if(notice && notice.text && notice.text.trim() && !myRead()) n++;
    n += memos.filter(m => m.toUserId === currentUser.id && !m.readAt).length;
  }
  document.title = n ? `(${n}) ${BASE_TITLE}` : BASE_TITLE;
}

function addTask(){
  if(!isAdmin){ alert("관리자 모드에서만 업무를 추가할 수 있습니다."); return; }
  if(!ghConfig.token){ openSettings(); return; }
  const team = document.getElementById("inTeam").value;
  const title = document.getElementById("inTitle").value.trim();
  const owner = document.getElementById("inOwner").value.trim();
  const due = document.getElementById("inDue").value;
  const progress = Math.max(0, Math.min(100, Number(document.getElementById("inProgress").value) || 0));
  const memo = document.getElementById("inMemo").value.trim();

  if(!title || !due){
    alert("업무 내용과 마감일자를 입력해주세요.");
    return;
  }
  const newTask = {id: cid(), team, title, owner, due, progress, memo, dueHistory: [], includeInReport: true};
  tasks.push(newTask);
  taskDirty.set(newTask.id, newTask);
  document.getElementById("inTitle").value = "";
  document.getElementById("inOwner").value = "";
  document.getElementById("inDue").value = "";
  document.getElementById("inProgress").value = 0;
  document.getElementById("inMemo").value = "";
  render();
  persist(`업무 추가: ${title}`);
}

function editProgress(id){
  if(!isAdmin){ alert("관리자 모드에서만 수정할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const val = prompt(`새 진행율을 입력하세요 (${t.progress}-100):`, t.progress);
  if(val === null) return;
  const num = Math.max(0, Math.min(100, Number(val)));
  if(isNaN(num)) return;
  if(num < t.progress){
    alert(`진행율은 낮출 수 없습니다. 현재 ${t.progress}%보다 낮은 값(${num}%)으로는 수정할 수 없습니다.`);
    return;
  }
  t.progress = num;
  if(num >= 100){ if(!t.completedAt) t.completedAt = new Date().toISOString(); }
  else { delete t.completedAt; }
  taskDirty.set(t.id, t);
  render();
  persist(`진행율 수정: ${t.title} → ${num}%`);
}

function markComplete(id){
  if(!isAdmin){ alert("관리자 모드에서만 처리할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.progress = 100;
  t.completedAt = new Date().toISOString();
  taskDirty.set(t.id, t);
  render();
  persist(`업무 완료 처리: ${t.title}`);
}

function reopenTask(id){
  if(!isAdmin){ alert("관리자 모드에서만 처리할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  if(!confirm("완료 처리를 취소하고 다시 진행중으로 되돌릴까요?")) return;
  t.progress = 90;
  delete t.completedAt;
  taskDirty.set(t.id, t);
  render();
  persist(`업무 완료 취소: ${t.title}`);
}

function deleteTask(id){
  if(!isAdmin){ alert("관리자 모드에서만 삭제할 수 있습니다."); return; }
  if(!confirm("이 업무를 삭제할까요?")) return;
  const removed = tasks.find(t=>t.id===id);
  tasks = tasks.filter(t=>t.id!==id);
  taskDirty.set(id, 'DELETE');
  render();
  persist(`업무 삭제: ${removed ? removed.title : id}`);
}

function toggleReportInclude(id){
  if(!isAdmin){ alert("관리자 모드에서만 변경할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.includeInReport = t.includeInReport === false ? true : false;
  taskDirty.set(t.id, t);
  persist(`주간보고 포함 변경: ${t.title} → ${t.includeInReport ? '포함' : '제외'}`);
}

function addAbsence(){
  if(!ghConfig.token){ openSettings(); return; }
  const team = document.getElementById("absTeam").value;
  const person = document.getElementById("absPerson").value.trim();
  const type = document.getElementById("absType").value;
  const start = document.getElementById("absStart").value;
  const end = document.getElementById("absEnd").value || start;
  const memo = document.getElementById("absMemo").value.trim();

  if(!person || !start){
    alert("이름과 시작일을 입력해주세요.");
    return;
  }
  if(end < start){
    alert("종료일은 시작일보다 빠를 수 없습니다.");

  }
  const newAbsence = {id: cid(), team, person, type, start, end, memo};
  absences.push(newAbsence);
  absenceDirty.set(newAbsence.id, newAbsence);
  document.getElementById("absPerson").value = "";
  document.getElementById("absStart").value = "";
  document.getElementById("absEnd").value = "";
  document.getElementById("absMemo").value = "";
  render();
  persist(`일정 추가: ${person}`);
}

    <h3>일정 수정</h3>
    <div class="field">
      <label>팀</label>

        <option value="safety" ${a.team==='safety'?'selected':''}>안전</option>

    </div>

      <label>이름</label>

      <label>유형</label>
      <select id="modalAbsType">
        <option value="inspect" ${a.type==='inspect'?'selected':''}>점검</option>
        <option value="training" ${a.type==='training'?'selected':''}>교육</option>

      </select>
    </div>
    <div class="field">

      <input type="date" id="modalAbsStart" value="${a.start}">
    </div>
    <div class="field">
      <label>종료일</label>
      <input type="date" id="modalAbsEnd" value="${a.end}">
    </div>
    <div class="field">
      <label>메모</label>

    </div>
    <div class="modal-actions">
      <button class="btn-ghost" style="margin-right:auto;color:var(--red);" onclick="deleteAbsence('${a.id}')">삭제</button>

function saveAbsenceEdit(id){
  const a = absences.find(x=>x.id===id);
  if(!a) return;
  const start = document.getElementById("modalAbsStart").value;
  const end = document.getElementById("modalAbsEnd").value || start;
  const person = document.getElementById("modalAbsPerson").value.trim();
  if(!person || !start){
    alert("이름과 시작일을 입력해주세요.");
    return;
  }
  if(end < start){
    alert("종료일은 시작일보다 빠를 수 없습니다.");
    return;
  }
  a.team = document.getElementById("modalAbsTeam").value;
  a.person = person;
  a.type = document.getElementById("modalAbsType").value;
  a.start = start;
  a.end = end;
  a.memo = document.getElementById("modalAbsMemo").value.trim();
  absenceDirty.set(a.id, a);
  closeModal();
  render();
  persist(`일정 수정: ${a.person}`);

function deleteAbsence(id){
  if(!confirm("이 일정을 삭제할까요?")) return;
  const removed = absences.find(a=>a.id===id);
  absences = absences.filter(a=>a.id!==id);
  absenceDirty.set(id, 'DELETE');
  closeModal();
  render();
  persist(`일정 삭제: ${removed ? removed.person : id}`);
}

function formatDateTime(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openModal(html, wide){
  const box = document.getElementById("modalBox");
  box.innerHTML = html;
  box.classList.toggle("wide", !!wide);
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
}

function openEditDue(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  openModal(`
    <h3>마감일자 수정</h3>
    <div class="field">
      <label>현재 마감일</label>
      <input type="text" value="${t.due}" disabled>
    </div>
    <div class="field">
      <label>새 마감일</label>
      <input type="date" id="modalNewDue" value="${t.due}">
    </div>
    <div class="field">
      <label>변경 사유 (선택)</label>
      <input type="text" id="modalReason" placeholder="예: 현장 사정으로 연기">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveDueEdit('${t.id}')">저장</button>
    </div>
  `);
}

function saveDueEdit(id){
  if(!isAdmin){ alert("관리자 모드에서만 수정할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const newDue = document.getElementById("modalNewDue").value;
  const reason = document.getElementById("modalReason").value.trim();
  if(!newDue){
    alert("새 마감일을 입력해주세요.");
    return;
  }
  let changed = false;
  if(newDue !== t.due){
    if(!Array.isArray(t.dueHistory)) t.dueHistory = [];
    t.dueHistory.push({
      from: t.due,
      to: newDue,
      changedAt: new Date().toISOString(),
      reason: reason || ""
    });
    t.due = newDue;
    changed = true;
  }
  if(changed) taskDirty.set(t.id, t);
  closeModal();
  render();
  if(changed) persist(`마감일 수정: ${t.title}`);
}

function viewMemo(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const content = t.memo ? escapeHtml(t.memo).replace(/\n/g,'<br>') : '등록된 내용이 없습니다.';
  openModal(`
    <h3>기타 내용 — ${escapeHtml(t.title)}</h3>
    <div class="memo-view">${content}</div>
    <div class="modal-actions">
      ${isAdmin ? `<button class="btn-ghost" onclick="openEditMemo('${t.id}')">수정</button>` : ''}
      <button class="btn-primary" onclick="closeModal()">닫기</button>
    </div>
  `);
}

function openEditMemo(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  openModal(`
    <h3>기타 내용 수정</h3>
    <div class="field">
      <label>업무: ${escapeHtml(t.title)}</label>
      <textarea id="modalMemo" rows="5" placeholder="세부 내용/특이사항을 입력하세요">${escapeHtml(t.memo || '')}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="saveMemoEdit('${t.id}')">저장</button>
    </div>
  `);
}

function saveMemoEdit(id){
  if(!isAdmin){ alert("관리자 모드에서만 수정할 수 있습니다."); return; }
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const newMemo = document.getElementById("modalMemo").value.trim();
  const changed = newMemo !== (t.memo || '');
  t.memo = newMemo;
  if(changed) taskDirty.set(t.id, t);
  closeModal();
  render();
  if(changed) persist(`기타 내용 수정: ${t.title}`);
}

function openHistory(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const history = (t.dueHistory || []).slice().sort((a,b)=> new Date(b.changedAt) - new Date(a.changedAt));
  const rows = history.length
    ? history.map(h => `
        <tr>
          <td>${formatDateTime(h.changedAt)}</td>
          <td><span class="hist-old">${h.from}</span><span class="hist-arrow">→</span><span class="hist-new">${h.to}</span></td>
          <td>${escapeHtml(h.reason || '-')}</td>
        </tr>
      `).join("")
    : `<tr><td colspan="3" class="hist-empty">마감일 변경 이력이 없습니다.</td></tr>`;

  openModal(`
    <h3>마감일 변경 이력 — ${escapeHtml(t.title)}</h3>
    <table class="hist-table">
      <thead><tr><th>변경일시</th><th>변경 내용</th><th>사유</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">닫기</button>
    </div>
  `);
}

document.getElementById("modalOverlay").addEventListener("click", (e)=>{
  if(e.target.id === "modalOverlay") closeModal();
});

document.getElementById("tabs").addEventListener("click", (e)=>{
  const tabEl = e.target.closest(".tab");
  if(!tabEl) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  tabEl.classList.add("active");
  activeTab = tabEl.dataset.tab;
  updateAdminUI();
  renderContent();
});

syncCurrentUser();
updateAdminUI();
renderAuthGate();
loadInitial();
</script>
